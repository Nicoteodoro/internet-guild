<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Guild</title>
  <link rel="canonical" href="https://internetguild.co/">
  <link rel="preload" href="work-sans-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico?v=fav2" sizes="any">
  <link rel="icon" type="image/png" href="favicon-192.png?v=fav2" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=fav2">
  <style>
    html,
    body {
      margin: 0;
    }

    /* Work Sans, self-hosted (SIL Open Font License, work-sans-OFL.txt) */
    @font-face {
      font-family: "Work Sans";
      src: url("work-sans-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "Work Sans", system-ui, -apple-system, sans-serif;
      font-weight: 400;
      letter-spacing: -0.4px;
      font-size: 14px;
      line-height: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* The whole page is one screen tall, the text in the middle of it both
       ways */
    .screen {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 20px;
      text-align: center;
    }

    p {
      margin: 0;
    }

    /* One blank line between the two blocks */
    p + p {
      margin-top: 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div>
      <p>Design + code for the new internet<br>Websites, products and AI for founders who embrace simplicity.<br>Essentialist studio, born to reduce.<br>Eleven years of practice.</p>
      <p>Hire the guild<br><a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a></p>
    </div>
  </div>
</body>
</html>
