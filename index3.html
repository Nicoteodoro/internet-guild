<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Guild</title>
  <link rel="canonical" href="https://internetguild.co/">
  <link rel="preload" href="neue-montreal-medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico?v=fav2" sizes="any">
  <link rel="icon" type="image/png" href="favicon-192.png?v=fav2" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=fav2">
  <style>
    html,
    body {
      margin: 0;
    }

    /* PP Neue Montreal, self-hosted at the one weight the page uses */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      letter-spacing: 0.01px;
      font-size: 14px;
      line-height: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* The whole page is one screen tall, the block of text in the middle of
       it both ways, its lines centred */
    .screen {
      box-sizing: border-box;
      display: grid;
      place-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 20px;
      text-align: center;
    }

    p {
      margin: 0;
    }

    /* The engraving above the text, centred with it. It is drawn dark on a
       clear ground, so it needs nothing done to it on the white page */
    .logo {
      display: block;
      width: 240px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 32px;
    }

    /* One blank line between the two blocks */
    p + p {
      margin-top: 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div>
      <img class="logo" src="logo-black.webp" alt="Internet Guild" width="900" height="822">
      <p>Essentialist studio, born to reduce.<br>Websites, products and AI for founders who embrace simplicity.<br>Eleven years of practice. We design, build and launch.</p>
      <p>Hire the guild<br><a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a></p>
    </div>
  </div>
</body>
</html>
