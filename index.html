<style>
  html, body { margin: 0; background: #ffffff; color: #1d1d1f; }
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; font-variation-settings: "opsz" 32; /* Inter Display */
    font-size: 14px; line-height: 20px; text-align: center;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  p, h1 { margin: 0; }

  /* logo, fixed at the top */
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: center; padding: 24px 16px; }
  .logo { display: block; width: 52px; height: 52px; }

  /* the two lines, in the middle of the screen */
  main { min-height: 100vh; min-height: 100svh; box-sizing: border-box; padding: 88px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 16px; line-height: 20px; font-weight: 400; color: #1d1d1f; text-wrap: balance; }
  main p { margin-top: 4px; color: #6e6e73; text-wrap: balance; }

</style>
