<style>
  @font-face { font-family: "Helvetica Neue IG"; src: url("/helvetica-neue-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Helvetica Neue IG"; src: url("/helvetica-neue-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --dim: #8e8e8e;
    --faint: #b3b3b3;
    --edge: 12px;
    --font: "Helvetica Neue IG", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font); font-size: 14px; line-height: 18px; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; transition: color .2s ease; }
  a:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
  p { margin: 0; }
  h1, h2 { margin: 0; font: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* the wordmark, fixed and centred at the top; drawn white with "difference" so it reads black on light and white on dark */
  .top { position: fixed; top: 24px; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; mix-blend-mode: difference; pointer-events: none; }
  .top a { pointer-events: auto; }
  .logo { display: block; width: 120px; height: auto; }

  /* the studio, fixed on the left, half way down */
  .studio { position: fixed; left: var(--edge); top: 50%; transform: translateY(-50%); max-width: 340px; }
  .studio .name { font-weight: 500; text-transform: uppercase; }
  .studio .gap { height: 18px; }
  .studio .gap-l { height: 40px; }
  .studio .contact a { color: var(--dim); }
  .studio .contact a:hover { color: var(--fg); }

  /* the work: one centred column, 700px at most, each piece whole at its own shape */
  .work { display: grid; justify-content: center; grid-template-columns: minmax(0, 700px); gap: 56px; padding: 352px var(--edge) 160px; }
  .piece { margin: 0; position: relative; aspect-ratio: var(--ar); border-radius: 32px; overflow: hidden; background: #ededed; }
  .piece img, .piece video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s ease; }
  .piece .loaded { opacity: 1; }

  /* the footer, fixed along the bottom */
  .foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--edge) 12px; font-size: 12px; line-height: 16px; pointer-events: none; }
  .foot > * { pointer-events: auto; }
  .foot .copy { color: var(--faint); font-size: 10px; }
  .foot nav { display: flex; gap: 30px; }
  .foot nav a { color: var(--dim); }
  .foot nav a:hover { color: var(--fg); }

  /* narrower screens: no room beside the column, so everything stacks */
  @media (max-width: 1300px) {
    .studio { position: static; transform: none; max-width: 700px; margin: 160px auto 0; padding: 0 var(--edge); box-sizing: content-box; }
    .work { padding-top: 96px; }
    .foot { position: static; padding-top: 0; }
  }
  @media (max-width: 600px) {
    .studio { margin-top: 120px; }
    .work { gap: 24px; padding-top: 72px; padding-bottom: 96px; }
    .piece { border-radius: 20px; }
    .foot { flex-direction: column-reverse; align-items: flex-start; gap: 16px; }
    .foot nav { gap: 20px; }
  }
</style>

        if (c.p.type === "video" && c.m.classList.contains("loaded") && !reduced) { if (c.inView) c.m.play().catch(function () {}); else c.m.pause(); }
      });
    }, { threshold: 0.2 });
    items.forEach(function (c) { near.observe(c.el); view.observe(c.el); });
  } else items.forEach(load);
})();
</script>
