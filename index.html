<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Internet Guild</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: "Times New Roman", Times, serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 24px;
      box-sizing: border-box;
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: inherit;
      font-weight: 500;
      font-size: 20px;
      color: #ffffff;
    }

    p {
      margin: 0;
      font-family: inherit;
      font-weight: 400;
      font-size: 16px;
      color: #ffffff;
      max-width: 320px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 16px;
      margin-top: 18px;
    }

    .menu a {
      position: relative;
      font-family: inherit;
      font-weight: 400;
      font-size: 14px;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    /* Invisible ~44px touch area, same look */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -14px -8px;
    }

    .menu a:hover {
      color: #ffffff;
    }

    .menu a:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="stack">
    <h1>Internet Guild</h1>
    <p>Design and code studio born on the web,<br>built by hand and armed with AI.</p>
    <nav class="menu" aria-label="Main">
      <a href="work.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</body>
</html>
