  <style>
    html,
    body {
      margin: 0;
    }

    /* Keep the scrollbar there whether the page needs it or not, so moving
       between a long page and a short one does not shift the layout sideways.
       Preferred over scrollbar-gutter, which reserves a fixed width even where
       scrollbars overlay the page and take none */
    html {
      overflow-y: scroll;
    }

    /* PP Neue Montreal, self-hosted at the one weight the page uses */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #333333;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      letter-spacing: 0.1px;
      font-size: 11px;
      line-height: 12px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }

    /* The wordmark and the menu are in capitals, in the header and in the
       phone's sheet; the rest reads as it is written */
    h1,
    .menu a,
    .menu-open,
    .menu-close {
      font-weight: 500;
      text-transform: uppercase;
    }

    button {
      letter-spacing: inherit;
      text-transform: inherit;
    }



    .muted {
      color: #333333;
    }

    /* The nav is one colour throughout, the address's note included. The
       note is in capitals, a point under the rest; the address itself stays
       as it is written */
    .contact .muted {
      color: inherit;
      font-size: 10px;
      text-transform: uppercase;
    }

    /* Header and grid share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      position: relative;
      padding-block: 12px 120px;
      column-gap: 16px;
    }

    /* The mark stands left of the wordmark at the height of its capitals,
       its foot on the wordmark's baseline, 22 down (11 on a 12 line, the
       line 12 down). It is its own element, apart from the wordmark. The
       wordmark makes room for it: the mark's width, 414 by 215, and a gap
       of 2px */
    .mark {
      position: absolute;
      left: 12px;
      top: calc(22px - 0.715em);
      height: 0.715em;
      width: auto;
      pointer-events: none;
    }

    .top h1 {
      box-sizing: border-box;
      padding-left: calc(0.715em * 414 / 215 + 2px);
    }

    /* The line alone reads on 14, two more than the rest */
    .tagline {
      line-height: 14px;
    }

    /* No commas: the words are held apart by space alone, twice what a
       comma and its gap used to take */
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 23px;
    }

    /* Wide, the menu runs in capitals held apart by commas, and the four
       parts of the header sit on one baseline */
    @media (min-width: 561px) {
      .top {
        align-items: baseline;
      }

      .menu {
        gap: 0 10px;
      }

      .menu > a:not(:last-child)::after {
        content: ",";
      }
    }

    /* The phone's own menu controls; the wide header needs neither */
    .menu-head,
    .menu-open {
      display: none;
    }

    .menu a {
      position: relative;
    }

    /* The menu is set a point under the rest. The phone's wordmark in the
       sheet is not one of its links */
    .menu > a {
      font-size: 10px;
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }




    /* The one rule on the page, naming the view */
    .bar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-inline: 12px;
      padding-block: 8px 12px;
      border-top: 1px solid #e6e6e6;
      text-transform: uppercase;
    }

    .count {
      display: flex;
      gap: 12px;
    }

    /* Reads as the text beside it; only the pointer says it is a control */
    .remix {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: #333333;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .remix:hover {
      color: #000000;
    }

    /* Six pieces to a row, 16 across and 20 down. Narrower screens take
       three, two, then one */
    .index {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 20px 16px;
      padding-bottom: 12px;
    }

    @media (max-width: 1100px) {
      .index {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .cell {
      margin: 0;
      min-width: 0;
    }

    /* Titles stand above their piece, held to one line, so every cell stands
       the same height */
    figcaption {
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* Every piece is squared off and cropped to fill, so the grid never breaks */
    .media {
      aspect-ratio: 1 / 1;
      background: #f4f4f4;
      overflow: hidden;
    }

    .media img,
    .media video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }


    @media (max-width: 900px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* On a desk the wordmark, the address and the menu stay put while the
       page runs under them; the line scrolls away with it. They invert over
       what they cross: #cccccc in difference reads #333333 on the white page
       and light over anything dark. The mark is drawn #333333 and inverted
       to #cccccc, so it goes through the same blend and does the same */
    @media (min-width: 901px) {
      /* --col is one column of the nav's measure: the width less the two 12
         edges and the 16 between n columns, shared out */
      .top {
        --n: 4;
        --col: calc((100% - 24px - (var(--n) - 1) * 16px) / var(--n));
        grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      }

      .top h1,
      .top .contact,
      .top .menu {
        position: fixed;
        top: 12px;
        z-index: 5;
        width: var(--col);
        color: #cccccc;
        mix-blend-mode: difference;
      }

      .mark {
        position: fixed;
        z-index: 6;
        filter: invert(1);
        mix-blend-mode: difference;
      }

      .top h1 {
        left: 12px;
      }

      /* The nav reads across: the wordmark, the address, the line, the menu.
         The line takes the third quarter and scrolls away with the page */
      .top .contact {
        left: calc(12px + var(--col) + 16px);
      }

      /* On 14 its first line stands 1px lower than the nav's; it comes up by
         that, so all four share a baseline */
      .tagline {
        grid-column: 3;
        margin-top: -1px;
      }

      .top .menu {
        left: calc(12px + 3 * (var(--col) + 16px));
      }
    }

    /* Over 1100 the work below is six columns, and the nav stands on them:
       the wordmark one, the address one, the line two, the menu two */
    @media (min-width: 1101px) {
      .top {
        --n: 6;
      }

      .tagline {
        grid-column: 3 / span 2;
      }

      .top .menu {
        left: calc(12px + 4 * (var(--col) + 16px));
        width: calc(2 * var(--col) + 16px);
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 0;
        padding-block: 12px 112px;
      }

      /* The line sits under the wordmark, full width, so each of its lines
         runs whole where it can */
      .tagline {
        grid-column: 1;
        padding-top: 56px;
      }

      .menu-head .mark-sheet {
        height: 0.715em;
        width: auto;
        margin-right: 2px;
      }

      /* The address goes on a phone: the menu carries Contact */
      .contact {
        display: none;
      }

      /* The menu leaves the header for a sheet of its own. Closed, it is
         rolled up out of sight; Menu at the top right pulls it down over the
         page, and the words follow it in one after another */
      .top {
        position: relative;
      }

      .menu-open,
      .menu-close {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: #333333;
        cursor: pointer;
      }

      .menu-open {
        display: block;
        position: absolute;
        top: 12px;
        right: 12px;
      }

      .menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 0;
        padding: 12px;
        background: #ffffff;
        visibility: hidden;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 0.5s cubic-bezier(0.7, 0, 0.2, 1), visibility 0s linear 0.5s;
      }

      .menu-is-open .menu {
        visibility: visible;
        clip-path: inset(0);
        transition: clip-path 0.5s cubic-bezier(0.7, 0, 0.2, 1);
      }

      /* The wordmark and Close stand where the wordmark and Menu stood */
      .menu-head {
        display: flex;
        justify-content: space-between;
        align-self: stretch;
        margin-bottom: 22vh;
      }

      .menu-head a,
      .menu > a {
        color: #333333;
      }

      .menu > a {
        line-height: 36px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .menu-is-open .menu > a {
        opacity: 1;
        transform: none;
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .menu-is-open .menu > a:nth-of-type(1) { transition-delay: 0.22s; }
      .menu-is-open .menu > a:nth-of-type(2) { transition-delay: 0.3s; }
      .menu-is-open .menu > a:nth-of-type(3) { transition-delay: 0.38s; }
      .menu-is-open .menu > a:nth-of-type(4) { transition-delay: 0.46s; }

      /* Nothing scrolls behind the sheet */
      .menu-is-open,
      .menu-is-open body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .menu,
        .menu > a,
        .menu-is-open .menu,
        .menu-is-open .menu > a {
          transition: none;
        }
      }

      /* iPhone only. Safari on iOS 26 fills the area under its own bottom bar
         with the colour of a fixed element touching the bottom of the screen.
         This strip is that element, so what scrolls does not show under the
         address bar; above the curtain too, so the colour stays white */
      @supports (-webkit-touch-callout: none) {
        .edge {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 4px;
          background: #ffffff;
          z-index: 11;
        }
      }

      .bar {
        gap: 12px;
      }
    }
  </style>
</head>

  <script>
    // Films play only while on screen, and never with reduced motion
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !reduceMotion.matches) {
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.1 });

    // Posters load about one screen ahead of the scroll
    const posterObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (!isIntersecting) return;
        target.poster = target.dataset.poster;
        observer.unobserve(target);
      });
    }, { rootMargin: '100% 0px 100% 0px' });

    document.querySelectorAll('.media video').forEach((video) => {
      video.muted = true;
      videoObserver.observe(video);
      if (video.dataset.poster) posterObserver.observe(video);
    });

    // Remix deals the same pieces into a new order
    const index = document.querySelector('.index');

    function remix() {
      const cells = [...index.children];

      for (let i = cells.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }

      index.append(...cells);

      // Whatever lands in the top row is wanted straight away
      cells.slice(0, 4).forEach((cell) => {
        const image = cell.querySelector('img');
        if (image) image.loading = 'eager';
      });

      // Moving a film can stop it, so have the observer judge each one afresh
      index.querySelectorAll('video').forEach((video) => {
        videoObserver.unobserve(video);
        videoObserver.observe(video);
      });
    }

    // The gallery opens on a different order every time it is loaded
    remix();

    document.querySelector('.remix').addEventListener('click', remix);
  </script>
  <script>
    // The phone menu: Menu pulls the sheet down, Close or Escape rolls it up
    (() => {
      const root = document.documentElement;
      const open = document.querySelector('.menu-open');
      const close = document.querySelector('.menu-close');
      const set = (on) => {
        root.classList.toggle('menu-is-open', on);
        open.setAttribute('aria-expanded', String(on));
        (on ? close : open).focus({ preventScroll: true });
      };
      open.addEventListener('click', () => set(true));
      close.addEventListener('click', () => set(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && root.classList.contains('menu-is-open')) set(false);
      });
      // Coming back to the page from history, the sheet is rolled up again
      addEventListener('pageshow', (e) => {
        if (!e.persisted) return;
        root.classList.remove('menu-is-open');
        open.setAttribute('aria-expanded', 'false');
      });
    })();
  </script>
</body>
</html>
