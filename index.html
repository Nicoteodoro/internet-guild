<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internet Design Studio</title>
<meta name="description" content="Design and engineering for the new web. We design, build and ship websites, products and AI for founders who embrace simplicity.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400&display=swap">
<style>
  html, body { margin: 0; background: #ffffff; color: #1d1d1f; }
  body {
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400; font-variation-settings: "opsz" 32; /* Inter Display */
    font-size: 14px; line-height: 20px; text-align: center;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  p, h1 { margin: 0; }

  /* the two lines, in the middle of the screen */
  main { min-height: 100vh; min-height: 100svh; box-sizing: border-box; padding: 48px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 16px; line-height: 20px; font-weight: 400; color: #1d1d1f; text-wrap: balance; }
  main p { margin-top: 12px; max-width: 500px; color: #6e6e73; }

  @media (max-width: 380px) { br.wide { display: none; } }
</style>
</head>
<body>

<main>
  <h1>Design and engineering for the new web</h1>
  <p>We design, build and ship websites, products<br class="wide"> and AI for founders who embrace simplicity.</p>
</main>

</body>
</html>
