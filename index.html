<meta property="og:title" content="Internet Guild">
<meta property="og:description" content="Design and development studio, born to reduce.">
<meta name="theme-color" content="#000000">
<link rel="preload" href="/neue-montreal-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/neue-montreal-medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* PP Neue Montreal, self-hosted: Regular for the words, Medium for the name and the buttons */
  @font-face {
    font-family: "PP Neue Montreal";
    src: url("/neue-montreal-regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "PP Neue Montreal";
    src: url("/neue-montreal-medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  /* single dark look: everything centered on one column, icon → name → statement → links */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --fg-dim: rgba(255, 255, 255, 0.86);
    --font-name: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-block: max(48px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  /* soft cross-page transition: the icon stays put, the rest crossfades */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }
  ::view-transition-group(mark) { animation-duration: .3s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
  .mark {
    width: 320px;
    max-width: 100%;
    margin: 0 auto;
    view-transition-name: mark;
  }
  /* same height on every page, so the icon sits at the same spot on all of them */
  .after {
    width: 100%;
    height: 272px;
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin: 0;
    font-family: var(--font-name);
    font-weight: 500;
    font-size: 18px;
    line-height: 1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .statement {
    margin: 28px 0 0;
    font-family: var(--font-name);
    font-size: 14px;
    line-height: 1.4;
    color: var(--fg-dim);
  }
  .statement span { display: block; text-wrap: balance; }
  nav {
    margin-top: 44px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 34px;
    padding: 0 16px;
    font-family: var(--font-name);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    border-radius: 0;
    transition: background-color .2s ease, color .2s ease;
  }
  .btn-primary { background: #ffffff; color: #000000; }
  .btn-primary:hover { background: #e4e4e4; }
  .btn-secondary { background: #1c1c1e; color: #ffffff; }
  .btn-secondary:hover { background: #2a2a2d; }
  .btn:focus-visible { outline: 1px solid #ffffff; outline-offset: 3px; }
  @media (max-width: 480px) {
    .statement span { display: inline; }
    nav { margin-top: 36px; }
  }
</style>
