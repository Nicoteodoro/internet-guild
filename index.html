<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Guild</title>
  <link rel="canonical" href="https://internetguild.co/">
  <style>
    /* One screen, white, nothing to scroll; the name in the middle of the
       window. The name is placed on its own, not as part of a layout, so
       nothing a browser extension slips into the page can push it about */
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    h1 {
      position: fixed;
      top: 50%;
      left: 50%;
      margin: 0;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      font-weight: 500;
      font-style: italic;
      line-height: 1;
    }
  </style>
</head>
<body>
  <h1>INTERNET GUILD</h1>
</body>
</html>
