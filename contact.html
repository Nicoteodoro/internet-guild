  <style>
    html,
    body {
      margin: 0;
    }

    /* Keep the scrollbar there whether the page needs it or not, so moving
       between a long page and a short one does not shift the layout sideways.
       Preferred over scrollbar-gutter, which reserves a fixed width even where
       scrollbars overlay the page and take none */
    html {
      overflow-y: scroll;
    }

    /* PP Neue Montreal, self-hosted in the two weights the site uses, each
       converted from the delivered outlines and cut to the Latin set */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #242424;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 12px;
      line-height: 17px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #242424;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }


    /* The wordmark is set, not drawn, so it takes the face the rest of the
       page does. Only the mark stays a drawing, standing at the cap height
       of the line it opens and holding the gap it holds in the lockup */
    .mark {
      height: 0.715em;
      width: auto;
      margin-right: 0.18em;
      vertical-align: baseline;
    }

    .muted {
      color: #949494;
    }

    /* Header and content share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      padding-block: 8px 0;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
    }

    .menu a {
      position: relative;
      color: #949494;
      transition: color 0.15s ease;
    }

    /* Commas set by the row rather than written into the links, so a phone
       can drop them without touching the words */
    .menu a:not(:last-child)::after {
      content: ",";
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu a:hover,
    .menu a[aria-current] {
      color: #242424;
    }

    /* The copy sits in the last column, starting where the menu starts, and
       the same 80px below the header as the hero sits on the home */
    .page {
      padding-block: 80px;
    }

    .copy {
      grid-column: 4;
      min-width: 0;
      padding-right: 80px;
      text-wrap: pretty;
    }

    .copy p + p {
      margin-top: 16px;
    }






    /* Links in the copy read as text until you reach for them */
    .copy a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .copy a:hover {
      text-decoration-line: underline;
    }

    @media (max-width: 1200px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }

      /* The empty column only holds the menu out to the fourth slot */
      .spacer {
        display: none;
      }

      .copy {
        grid-column: 2;
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 28px;
      }

      /* The address goes on a phone: the page itself already carries it */
      .contact {
        display: none;
      }

      /* Full width here, but still off the right edge: a line of copy runs
         the whole way across, and the frame alone leaves it hugging the side */
      .copy {
        grid-column: 1;
        padding-right: 32px;
      }

      /* Room under the copy so the floating menu never sits on a line */
      .page {
        padding-block: 56px 88px;
      }

      /* The menu leaves the header and floats at the foot of the screen as
         a pill of glass: translucent, blurring whatever scrolls beneath it,
         lit along the top edge and resting on its own shadow */
      .menu {
        position: fixed;
        top: auto;
        right: auto;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        flex-wrap: nowrap;
        width: max-content;
        max-width: calc(100% - 24px);
        justify-content: center;
        gap: 0;
        padding: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.62);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        /* The rim is drawn by the shadow rather than a border, because a
           border cannot go under a whole pixel: at 1px it stacked with the
           highlight beneath it into a 2px band of white. Half a pixel of
           each reads as the one hairline it should be */
        box-shadow:
          0 1px 2px rgba(36, 36, 36, 0.05),
          0 5px 14px rgba(36, 36, 36, 0.07),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.7),
          inset 0 0.5px 0 rgba(255, 255, 255, 0.9),
          inset 0 -0.5px 0 rgba(255, 255, 255, 0.4);
      }

      /* Where the glass cannot blur it thickens instead, so the words never
         come to rest on a moving picture */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .menu {
          background: rgba(255, 255, 255, 0.93);
        }
      }

      /* Each word holds its own tap target here, so the invisible one the
         header hands out comes off. Full-strength text, since the glass is
         thin enough for a dark piece to show through it */
      .menu a {
        color: #242424;
        padding: 9px 14px;
        border-radius: 999px;
      }

      .menu a::before {
        content: none;
      }

      /* Narrower than a small phone the four words no longer fit the pill's
         own measure, and with nothing to wrap they would push past it. They
         give back four pixels of padding each side instead */
      @media (max-width: 340px) {
        .menu a {
          padding-inline: 10px;
        }
      }

      /* Set far enough apart here that they need no commas */
      .menu a:not(:last-child)::after {
        content: none;
      }
    }
  </style>
