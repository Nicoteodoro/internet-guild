  <style>
    html,
    body {
      margin: 0;
    }

    /* Keep the scrollbar there whether the page needs it or not, so moving
       between a long page and a short one does not shift the layout sideways.
       Preferred over scrollbar-gutter, which reserves a fixed width even where
       scrollbars overlay the page and take none */
    html {
      overflow-y: scroll;
    }

    /* IBM Plex Mono at 400 for the page, and DM Sans, one variable file, for
       the wordmark alone; both self-hosted */
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("ibm-plex-mono-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "DM Sans";
      src: url("dm-sans.woff2") format("woff2");
      font-weight: 100 1000;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-weight: 400;
      letter-spacing: 0.1px;
      font-size: 12px;
      line-height: 14px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }

    button {
      letter-spacing: inherit;
      text-transform: inherit;
    }



    .muted {
      color: #949494;
    }

    /* The nav is one colour throughout, the address's note included */
    .contact .muted {
      color: inherit;
    }

    /* Header and grid share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      position: relative;
      padding-block: 12px 0;
      column-gap: 16px;
    }

    /* The wordmark is orange, in DM Sans SemiBold, drawn in a half point
       tighter, here and in the phone's sheet */
    .top h1,
    .menu-head a {
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #f43b00;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 23px;
    }

    /* Wide, the menu runs on one line with no commas, its words 34px apart,
       and the parts of the header sit on one baseline */
    @media (min-width: 561px) {
      .top {
        align-items: baseline;
      }

      .menu {
        gap: 0 34px;
      }
    }

    /* The phone's own menu controls; the wide header needs neither */
    .menu-head,
    .menu-open {
      display: none;
    }

    .menu a {
      position: relative;
    }

    /* The address goes grey under the pointer; the menu underlines, and the
       page you are on stays underlined */
    .contact a {
      transition: color 0.15s ease;
    }

    .menu > a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .menu > a[aria-current] {
      text-decoration-line: underline;
    }

    @media (hover: hover) {
      .contact a:hover {
        color: #949494;
      }

      .menu > a:hover {
        text-decoration-line: underline;
      }
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }




    @media (max-width: 900px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Between 901 and 999 the header holds two columns, as on a tablet: the
       address, 221px of mono capitals, needs a column of that much */
    @media (min-width: 901px) and (max-width: 999px) {
      .top,
      .info {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* Under 1000 the nav is in the flow: the wordmark and the address across
       the top, the menu under the address */
    @media (max-width: 999px) {
      .menu {
        grid-column: 2;
      }
    }

    /* On a desk the wordmark, the address and the menu stay put while the
       page runs under them. The address and the menu invert over what they
       cross: #ffffff in difference reads #000000 on the #ffffff page and
       light over anything dark. The wordmark keeps its orange over all of it.
       The nav stands on the work's four columns: the wordmark the first, the
       second left empty, the address the third, the menu the fourth. From
       1360 the work has eight, and those four slots fall on its first, fifth
       and seventh columns */
    @media (min-width: 1000px) {
      .top {
        --col: calc((100% - 72px) / 4);
        min-height: 28px;
      }

      .top h1,
      .top .contact,
      .top .menu {
        position: fixed;
        top: 12px;
        z-index: 5;
        width: var(--col);
      }

      .top .contact,
      .top .menu {
        color: #ffffff;
        mix-blend-mode: difference;
      }

      /* In the blend the grey is set as its inverse: #6b6b6b in difference
         reads #949494 on the #ffffff page */
      @media (hover: hover) {
        .top .contact a:hover {
          color: #6b6b6b;
        }
      }

      .top h1 {
        left: 12px;
      }

      .top .contact {
        left: calc(12px + 2 * (var(--col) + 16px));
      }

      .top .menu {
        left: calc(12px + 3 * (var(--col) + 16px));
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 0;
      }

      /* The address goes on a phone: the menu carries Contact */
      .contact {
        display: none;
      }

      /* The menu leaves the header for a sheet of its own. Closed, it is
         rolled up out of sight; Menu at the top right pulls it down over the
         page, and the words follow it in one after another */
      .top {
        position: relative;
      }

      .menu-open,
      .menu-close {
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: #000000;
        cursor: pointer;
      }

      .menu-open {
        display: block;
        position: absolute;
        top: 12px;
        right: 12px;
      }

      .menu {
        position: fixed;
        inset: 0;
        z-index: 20;
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: flex-start;
        gap: 0;
        padding: 12px;
        background: #ffffff;
        visibility: hidden;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 0.5s cubic-bezier(0.7, 0, 0.2, 1), visibility 0s linear 0.5s;
      }

      .menu-is-open .menu {
        visibility: visible;
        clip-path: inset(0);
        transition: clip-path 0.5s cubic-bezier(0.7, 0, 0.2, 1);
      }

      /* The wordmark and Close stand where the wordmark and Menu stood */
      .menu-head {
        display: flex;
        justify-content: space-between;
        align-self: stretch;
        margin-bottom: 22vh;
      }

      .menu > a {
        color: #000000;
      }

      .menu > a {
        line-height: 36px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .menu-is-open .menu > a {
        opacity: 1;
        transform: none;
        transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
      }

      .menu-is-open .menu > a:nth-of-type(1) { transition-delay: 0.22s; }
      .menu-is-open .menu > a:nth-of-type(2) { transition-delay: 0.3s; }
      .menu-is-open .menu > a:nth-of-type(3) { transition-delay: 0.38s; }
      .menu-is-open .menu > a:nth-of-type(4) { transition-delay: 0.46s; }

      /* Nothing scrolls behind the sheet */
      .menu-is-open,
      .menu-is-open body {
        overflow: hidden;
      }

      @media (prefers-reduced-motion: reduce) {
        .menu,
        .menu > a,
        .menu-is-open .menu,
        .menu-is-open .menu > a {
          transition: none;
        }
      }

      /* iPhone only. Safari on iOS 26 fills the area under its own bottom bar
         with the colour of a fixed element touching the bottom of the screen.
         This strip is that element, so what scrolls does not show under the
         address bar; above the curtain too, so the colour stays white */
      @supports (-webkit-touch-callout: none) {
        .edge {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 4px;
          background: #ffffff;
          z-index: 11;
        }
      }
    }

    /* The text stands under the nav, as far down as the nav's own room, in
       the columns the nav's last two parts stand on */
    .top {
      padding-bottom: 88px;
    }

    @media (max-width: 999px) {
      .top {
        padding-bottom: 28px;
      }
    }

    .info {
      column-gap: 16px;
      padding-bottom: 12px;
    }

    .copy {
      grid-column: 1 / -1;
      min-width: 0;
      text-wrap: pretty;
    }

    /* A blank line between the blocks, one line high */
    .copy p + p {
      margin-top: 14px;
    }

    /* Links in the text underline and go grey under the pointer */
    .copy a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }

    .copy a:hover {
      color: #949494;
      text-decoration-line: underline;
    }

    /* The text runs under the fixed nav as it scrolls, so on a desk the nav
       keeps a band of the page's own ground behind it and the text goes out
       of sight there */
    @media (min-width: 1000px) {
      .top::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #ffffff;
        z-index: 4;
      }
    }

    /* Contact is short: the last column alone from 1000, the right half on a
       tablet */
    @media (min-width: 561px) and (max-width: 999px) {
      .info .copy {
        grid-column: 2;
      }
    }

    @media (min-width: 1000px) {
      .info .copy {
        grid-column: 4;
      }
    }

    .foot {
      color: #949494;
    }
  </style>
</head>

  <script>
    // The phone menu: Menu pulls the sheet down, Close or Escape rolls it up
    (() => {
      const root = document.documentElement;
      const open = document.querySelector('.menu-open');
      const close = document.querySelector('.menu-close');
      const set = (on) => {
        root.classList.toggle('menu-is-open', on);
        open.setAttribute('aria-expanded', String(on));
        (on ? close : open).focus({ preventScroll: true });
      };
      open.addEventListener('click', () => set(true));
      close.addEventListener('click', () => set(false));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && root.classList.contains('menu-is-open')) set(false);
      });
      // Coming back to the page from history, the sheet is rolled up again
      addEventListener('pageshow', (e) => {
        if (!e.persisted) return;
        root.classList.remove('menu-is-open');
        open.setAttribute('aria-expanded', 'false');
      });
    })();
  </script>
</body>
