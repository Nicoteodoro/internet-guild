  <style>
    html,
    body {
      margin: 0;
    }

    /* Keep the scrollbar there whether the page needs it or not, so moving
       between a long page and a short one does not shift the layout sideways.
       Preferred over scrollbar-gutter, which reserves a fixed width even where
       scrollbars overlay the page and take none */
    html {
      overflow-y: scroll;
    }

    /* PP Neue Montreal, self-hosted in the two weights the site uses, each
       converted from the delivered outlines and cut to the Latin set */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #242424;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #242424;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }


    /* The wordmark is set type only, two sizes up from the page, on the
       page's own line so the header row keeps its rhythm */
    h1 {
      font-size: 16px;
      line-height: 20px;
    }

    .muted {
      color: #949494;
    }

    /* Header and content share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      padding-block: 8px 0;
    }

    /* No commas: the words are held apart by space alone, twice what a
       comma and its gap used to take */
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 20px;
    }

    .menu a {
      position: relative;
      color: #949494;
      transition: color 0.15s ease;
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu a:hover,
    .menu a[aria-current] {
      color: #242424;
    }

    /* The copy sits in the last column, starting where the menu starts, and
       the same 80px below the header as the hero sits on the home */
    .page {
      padding-block: 80px;
    }

    .copy {
      grid-column: 4;
      min-width: 0;
      padding-right: 80px;
      text-wrap: pretty;
    }

    .copy p + p {
      margin-top: 20px;
    }






    /* Links in the copy read as text until you reach for them */
    .copy a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .copy a:hover {
      text-decoration-line: underline;
    }

    @media (max-width: 1200px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }

      /* The empty column only holds the menu out to the fourth slot */
      .spacer {
        display: none;
      }

      .copy {
        grid-column: 2;
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 28px;
      }

      /* The address goes on a phone: the page itself already carries it */
      .contact {
        display: none;
      }

      /* Full width here, but still off the right edge: a line of copy runs
         the whole way across, and the frame alone leaves it hugging the side */
      .copy {
        grid-column: 1;
        padding-right: 32px;
      }

      /* Room under the copy so the floating menu never sits on a line */
      .page {
        padding-block: 56px 64px;
      }

      /* The menu leaves the header and rides at the foot of the screen,
         set wider apart and a shade darker to carry on its own */
      .menu {
        position: fixed;
        inset: auto 0 0;
        justify-content: center;
        gap: 0 20px;
        padding: 14px 12px;
        background: #ffffff;
        border-top: 1px solid #e6e6e6;
      }

      .menu a {
        color: #555555;
      }

      /* iPhone only. Safari on iOS 26 fills the area under its own bottom bar
         with the colour of a fixed element touching the bottom of the screen.
         The menu bar does that once the page is showing; while the curtain is
         up it covers the bar, so this strip, above the curtain and inside the
         bar's lower padding, keeps the colour Safari takes white throughout */
      @supports (-webkit-touch-callout: none) {
        .edge {
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          height: 4px;
          background: #ffffff;
          z-index: 11;
        }
      }
    }
  </style>
</head>
<body>
  <div class="edge" aria-hidden="true"></div>
  <header class="row top">

    </div>

    <div class="spacer"></div>

    <nav class="menu" aria-label="Main">

      <a href="work.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="row page">
    <div class="copy">
      <p>Desk is open for new work.</p>
      <p>
        <a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a><br>
        <a href="https://t.me/nico_teodoro" target="_blank" rel="noopener">Telegram chat</a><br>

        <a href="https://x.com/internetguild_" target="_blank" rel="noopener">X</a>
      </p>
      <p class="muted">Hire the guild</p>
    </div>
  </main>

</body>
</html>
