<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Contact / Internet Guild</title>
  <meta name="description" content="Independent design and code studio. Websites, interfaces, and products for founders who value simplicity.">
  <link rel="canonical" href="https://internetguild.co/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Internet Guild">
  <meta property="og:url" content="https://internetguild.co/contact.html">
  <meta property="og:title" content="Contact / Internet Guild">
  <meta property="og:description" content="Independent design and code studio. Websites, interfaces, and products for founders who value simplicity.">
  <meta property="og:image" content="https://internetguild.co/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A typed page of the studio’s lines: Internet Guild, independent design and code studio.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html,
    body {
      margin: 0;
    }

    /* Keep the scrollbar there whether the page needs it or not, so moving
       between a long page and a short one does not shift the layout sideways.
       Preferred over scrollbar-gutter, which reserves a fixed width even where
       scrollbars overlay the page and take none */
    html {
      overflow-y: scroll;
    }

    /* Inter, self-hosted so the type does not wait on a third party. One file:
       the site uses nothing outside the Latin subset */
    @font-face {
      font-family: Inter;
      src: url("inter-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #242424;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 11px;
      line-height: 16px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #242424;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }


    /* The drawn wordmark, scaled so its caps stand at the same 8px the set
       type does, and dropped so its baseline meets the text baseline */
    .logo {
      height: 0.7556em;
      width: auto;
      vertical-align: -0.0244em;
    }

    .muted {
      color: #949494;
    }

    /* Header and content share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      padding-block: 8px 0;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
    }

    .menu a {
      position: relative;
      color: #949494;
      transition: color 0.15s ease;
    }

    /* Commas set by the row rather than written into the links, so a phone
       can drop them without touching the words */
    .menu a:not(:last-child)::after {
      content: ",";
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu a:hover,
    .menu a[aria-current] {
      color: #242424;
    }

    /* The copy sits in the last column, starting where the menu starts, and
       the same 80px below the header as the hero sits on the home */
    .page {
      padding-block: 80px;
    }

    .copy {
      grid-column: 4;
      min-width: 0;
      padding-right: 80px;
      text-wrap: pretty;
    }

    .copy p + p {
      margin-top: 16px;
    }






    /* Links in the copy read as text until you reach for them */
    .copy a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .copy a:hover {
      text-decoration-line: underline;
    }

    @media (max-width: 1200px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }

      /* The empty column only holds the menu out to the fourth slot */
      .spacer {
        display: none;
      }

      .copy {
        grid-column: 2;
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 28px;
      }

      /* The address goes on a phone: the page itself already carries it */
      .contact {
        display: none;
      }

      /* Full width here, but still off the right edge: a line of copy runs
         the whole way across, and the frame alone leaves it hugging the side */
      .copy {
        grid-column: 1;
        padding-right: 32px;
      }

      /* Room under the copy so the floating menu never sits on a line */
      .page {
        padding-block: 56px 64px;
      }

      /* The menu leaves the header and rides at the foot of the screen,
         set wider apart and a shade darker to carry on its own */
      .menu {
        position: fixed;
        inset: auto 0 0;
        justify-content: center;
        gap: 0 20px;
        padding: 14px 12px;
        background: #ffffff;
        border-top: 1px solid #e6e6e6;
      }

      .menu a {
        color: #555555;
      }

      /* Set far enough apart here that they need no commas */
      .menu a:not(:last-child)::after {
        content: none;
      }
    }
  </style>
</head>
<body>
  <header class="row top">
    <h1><a href="index.html"><img class="logo" src="logo.svg" alt="Internet Guild™" width="616" height="50" decoding="async"></a></h1>

    <div class="contact">
      <p class="muted">Hire the guild.</p>
      <p><a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a></p>
    </div>

    <div class="spacer"></div>

    <nav class="menu" aria-label="Main">
      <a href="index.html">Index</a>
      <a href="work.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="row page">
    <div class="copy">
      <p>Desk is open for new work.</p>
      <p>
        <a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a><br>
        Telegram <a href="https://t.me/internetguild" target="_blank" rel="noopener">@internetguild</a>
      </p>
      <p>Hire the guild.</p>
    </div>
  </main>

</body>
</html>
