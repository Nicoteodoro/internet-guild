<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Contact / Internet Guild</title>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preload" href="geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html,
    body {
      margin: 0;
    }

    /* Geist, self-hosted so the type does not wait on a third party */
    @font-face {
      font-family: Geist;
      src: url("geist-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                     U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
                     U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: Geist;
      src: url("geist-latin-ext.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
                     U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
                     U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Geist, system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 11px;
      line-height: 16px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #111111;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }

    .muted {
      color: #8a8a8a;
    }

    /* Header and content share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      padding-block: 8px 0;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
    }

    .menu a {
      position: relative;
      color: #8a8a8a;
      transition: color 0.15s ease;
    }

    /* Commas set by the row rather than written into the links, so a phone
       can drop them without touching the words */
    .menu a:not(:last-child)::after {
      content: ",";
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu a:hover,
    .menu a[aria-current] {
      color: #111111;
    }

    /* The copy sits in the last column, starting where the menu starts, and
       the same 80px below the header as the hero sits on the home */
    .page {
      padding-block: 80px;
    }

    .copy {
      grid-column: 4;
      min-width: 0;
      padding-right: 80px;
      text-wrap: pretty;
    }

    .copy p + p {
      margin-top: 16px;
    }






    /* Links in the copy read as text until you reach for them */
    .copy a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .copy a:hover {
      text-decoration-line: underline;
    }

    @media (prefers-reduced-motion: reduce) {
      .menu {
        transition: none;
      }
    }

    @media (max-width: 1200px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }

      /* The empty column only holds the menu out to the fourth slot */
      .spacer {
        display: none;
      }

      .copy {
        grid-column: 2;
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 28px;
      }

      /* Full width here, so it keeps the page's own frame on both sides */
      .copy {
        grid-column: 1;
        padding-right: 0;
      }

      /* Room under the copy so the floating menu never sits on a line */
      .page {
        padding-block: 56px 64px;
      }

      /* The menu leaves the header and rides at the foot of the screen,
         set wider apart and a shade darker to carry on its own */
      .menu {
        position: fixed;
        inset: auto 0 0;
        justify-content: center;
        gap: 0 20px;
        padding: 14px 12px;
        background: #ffffff;
        border-top: 1px solid #e6e6e6;
      }

      .menu a {
        color: #555555;
      }

      /* Set far enough apart here that they need no commas */
      .menu a:not(:last-child)::after {
        content: none;
      }

      /* With scripting it waits out of sight: the page opens without it and
         the first scroll down calls it up. Without scripting it simply stays */
      .js .menu {
        transform: translateY(100%);
        visibility: hidden;
        transition: transform 0.25s ease, visibility 0s 0.25s;
      }

      .js .menu.here {
        transform: none;
        visibility: visible;
        transition: transform 0.25s ease, visibility 0s;
      }
    }
  </style>
</head>
<body>
  <header class="row top">
    <h1><a href="index.html">Internet Guild</a></h1>

    <div class="contact">
      <p class="muted">Hire the guild.</p>
      <p><a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a></p>
    </div>

    <div class="spacer"></div>

    <nav class="menu" aria-label="Main">
      <a href="work.html">Works</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="row page">
    <div class="copy">
      <p>Desk is open for new work.</p>
      <p>
        <a href="mailto:webmaster@internetguild.co">webmaster@internetguild.co</a><br>
        Telegram <a href="https://t.me/internetguild" target="_blank" rel="noopener">@internetguild</a>
      </p>
      <p>Hire the guild.</p>
    </div>
  </main>

  <script>
    // On a phone the menu rides at the foot of the screen: the page opens
    // without it, scrolling down calls it up, scrolling back up sends it away
    const menu = document.querySelector('.menu');
    const phone = window.matchMedia('(max-width: 560px)');
    let lastY = window.scrollY;

    window.addEventListener('scroll', () => {
      // Clamped, so a rubber-band past either end does not read as a direction
      const y = Math.max(0, window.scrollY);
      const moved = y - lastY;

      if (Math.abs(moved) < 4) return;
      lastY = y;

      if (phone.matches) menu.classList.toggle('here', moved > 0);
    }, { passive: true });

    // Coming back to a phone width opens without it again
    phone.addEventListener('change', () => menu.classList.remove('here'));
  </script>
</body>
</html>
