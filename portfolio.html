<style>
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --card: #000000;
    --card-fg: #ffffff;
    --card-dim: rgba(255, 255, 255, 0.55);
    --col: min(720px, 100vw - 64px); /* the portfolio column */
    --font: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* the portfolio: one centred column that scrolls */
  .reel { list-style: none; margin: 0 auto; padding: 18vh 0; width: var(--col); display: flex; flex-direction: column; gap: 72px; }
  .card {
    position: relative; aspect-ratio: 16 / 10; border-radius: 40px; overflow: hidden;
    background: var(--card); color: var(--card-fg);
    transform-origin: 50% 50%; will-change: transform;
  }
  .stage { position: absolute; inset: 9% 12% 22%; display: flex; align-items: center; justify-content: center; }
  .stage img, .stage video {
    max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; border-radius: 14px;
    opacity: 0; transition: opacity .5s ease;
  }
  .stage .loaded { opacity: 1; }
  .info {
    position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; padding: 0 24px;
    font-size: 10px; line-height: 1.4; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .info b { display: block; font-weight: 500; }
  .info span { color: var(--card-dim); }

  @media (max-width: 900px) {
    :root { --col: calc(100vw - 32px); }
    .reel { padding: 16px 0 96px; gap: 40px; }
    .card { border-radius: 24px; aspect-ratio: 4 / 5; }
    .stage { inset: 8% 8% 22%; }
    .stage img, .stage video { border-radius: 10px; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transform: none !important; } }
</style>
</head>
<body>

    {"client": "Great Sky Solar", "tags": ["product"], "w": 1500, "h": 1500, "type": "image", "src": "/projects/great-sky-solar-monitoring.webp", "desc": "Great Sky Solar monitoring app."}
  ];

  var reel = document.getElementById("reel"), cards = [];
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  for (var k = PROJECTS.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), x = PROJECTS[k]; PROJECTS[k] = PROJECTS[j]; PROJECTS[j] = x; }

  PROJECTS.forEach(function (p) {
    var li = el("li", "card"), stage = el("div", "stage"), info = el("div", "info"), m;
    if (p.type === "video") {
      m = el("video"); m.muted = true; m.loop = true; m.playsInline = true; m.preload = "none";
      m.setAttribute("muted", ""); m.setAttribute("playsinline", ""); if (p.poster) m.poster = p.poster;
    } else { m = el("img"); m.alt = p.desc; m.decoding = "async"; }
    stage.appendChild(m); info.appendChild(el("b", null, p.client)); info.appendChild(el("span", null, p.desc.replace(/\.$/, "")));
    li.appendChild(stage); li.appendChild(info); reel.appendChild(li);
    cards.push({ el: li, p: p, m: m, requested: false, inView: false });
  });

  function load(c) {
    if (c.requested) return; c.requested = true;
    var done = function () { c.m.classList.add("loaded"); if (c.p.type === "video" && c.inView && !reduced) c.m.play().catch(function () {}); };
    if (c.p.type === "video") { c.m.addEventListener("loadeddata", done, { once: true }); c.m.src = c.p.src; c.m.load(); }
    else { c.m.addEventListener("load", done, { once: true }); c.m.src = c.p.src; if (c.m.complete && c.m.naturalWidth) done(); }
  }
  if ("IntersectionObserver" in window) {
    var near = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) load(cards[+e.target.dataset.i]); }); }, { rootMargin: "600px 0px" });
    var view = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var c = cards[+e.target.dataset.i]; c.inView = e.isIntersecting;
        if (c.p.type === "video" && c.m.classList.contains("loaded") && !reduced) { if (c.inView) c.m.play().catch(function () {}); else c.m.pause(); }
      });
    }, { threshold: 0.2 });
    cards.forEach(function (c, i) { c.el.dataset.i = i; near.observe(c.el); view.observe(c.el); });
  } else cards.forEach(load);

  // bend: cards tilt back as they move away from the middle of the screen, flat at the centre
  if (reduced) return;
  var ticking = false;
  function bend() {
    ticking = false;
    var vh = window.innerHeight, mid = vh / 2;
    cards.forEach(function (c) {
      var r = c.el.getBoundingClientRect();
      if (r.bottom < -200 || r.top > vh + 200) return;
      var d = Math.max(-1, Math.min(1, (mid - (r.top + r.height / 2)) / vh)); // -1 below … 1 above
      c.el.style.transform = "perspective(1400px) rotateX(" + (d * 28).toFixed(2) + "deg) scale(" + (1 - Math.abs(d) * 0.06).toFixed(3) + ")";
    });
  }
  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(bend); } }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll);
  bend();
})();
