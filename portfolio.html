<style>
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --col: min(720px, 100vw - 64px); /* the portfolio column */
    --font: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* the portfolio: one centred column that scrolls */
  .reel { list-style: none; margin: 0 auto; padding: 18vh 0; width: var(--col); display: flex; flex-direction: column; gap: 72px; }
  /* each card takes its piece's own shape, so the piece fills it edge to edge without cropping;
     tall pieces narrow down to stay within the screen */
  .card {
    position: relative; aspect-ratio: var(--ar); width: min(100%, 82vh * var(--ar)); margin: 0 auto;
    border-radius: 40px; overflow: hidden; background: #f2f2f2;
    transform-origin: 50% 50%; will-change: transform;
  }
  .card img, .card video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .5s ease;
  }
  .card .loaded { opacity: 1; }

  @media (max-width: 900px) {
    :root { --col: calc(100vw - 32px); }
    .reel { padding: 16px 0 96px; gap: 40px; }
    .card { border-radius: 24px; }
  }
  .veil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  [data-fx="stack"] .card { position: sticky; top: max(16px, (100vh - min(82vh, var(--col) / var(--ar))) / 2); transform-origin: 50% 0; }
  [data-fx="stack"] .reel { padding-bottom: 40vh; }
  [data-fx="wipe"] .card img, [data-fx="wipe"] .card video { transition: opacity .5s ease; will-change: transform; }
  @media (prefers-reduced-motion: reduce) { .card { transform: none !important; } }
</style>

  var reel = document.getElementById("reel"), cards = [];
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  PROJECTS.forEach(function (p) {
    var li = el("li", "card"), m;
    li.style.setProperty("--ar", (p.w / p.h).toFixed(4));
    if (p.type === "video") {
      m = el("video"); m.muted = true; m.loop = true; m.playsInline = true; m.preload = "none";
      m.setAttribute("muted", ""); m.setAttribute("playsinline", ""); if (p.poster) m.poster = p.poster;
    } else { m = el("img"); m.alt = p.desc; m.decoding = "async"; }
    li.appendChild(m); reel.appendChild(li);
    cards.push({ el: li, p: p, m: m, requested: false, inView: false });
  });

  function load(c) {
    if (c.requested) return; c.requested = true;
    var done = function () { c.m.classList.add("loaded"); if (c.p.type === "video" && c.inView && !reduced) c.m.play().catch(function () {}); };
    if (c.p.type === "video") { c.m.addEventListener("loadeddata", done, { once: true }); c.m.src = c.p.src; c.m.load(); }
    else { c.m.addEventListener("load", done, { once: true }); c.m.src = c.p.src; if (c.m.complete && c.m.naturalWidth) done(); }
  }
  if ("IntersectionObserver" in window) {
    var near = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) load(cards[+e.target.dataset.i]); }); }, { rootMargin: "600px 0px" });
    var view = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var c = cards[+e.target.dataset.i]; c.inView = e.isIntersecting;
        if (c.p.type === "video" && c.m.classList.contains("loaded") && !reduced) { if (c.inView) c.m.play().catch(function () {}); else c.m.pause(); }

    cards.forEach(function (c, i) { c.el.dataset.i = i; near.observe(c.el); view.observe(c.el); });
  } else cards.forEach(load);

  // scroll effects, picked with ?fx=  ·  kanji (default) · stack · focus · wipe · bend

  var fx = new URLSearchParams(location.search).get("fx");
  if (FX.indexOf(fx) < 0) fx = "kanji";
  document.documentElement.setAttribute("data-fx", fx);

  function clamp(v) { return Math.max(0, Math.min(1, v)); }

  var POOL = "一丶ノ二人入八十小夕日木心目田生光糸空門電夢網魂霊龍闇響魔".split("");
  function veil(c) {
    var cv = document.createElement("canvas"), dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = c.el.clientWidth, h = c.el.clientHeight, CELL = w < 400 ? 16 : 22;

    var ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (i = 0; i < n; i++) {
      ch[i] = POOL[(Math.random() * POOL.length) | 0];
      th[i] = (1 - ((i / cols) | 0) / rows) * 0.55 + Math.random() * 0.45; if (th[i] > max) max = th[i]; // clears from the bottom up
    }
    for (i = 0; i < n; i++) th[i] /= max;
    var font = '500 ' + (CELL * 0.6).toFixed(1) + 'px "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif', last = -1, lastScr = 0;
    return function (p, t) {
      if (p === last && t - lastScr < 90) return;
      if (t - lastScr >= 90) { lastScr = t; for (var k = 0; k < n * 0.08; k++) ch[(Math.random() * n) | 0] = POOL[(Math.random() * POOL.length) | 0]; }
      last = p; ctx.clearRect(0, 0, w, h);
      if (p >= 1) return;
      ctx.font = font; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      for (var j = 0; j < n; j++) {
        if (th[j] < p - 0.08) continue;
        var x = (j % cols) * CELL, y = ((j / cols) | 0) * CELL, hot = th[j] < p;
        ctx.fillStyle = hot ? "#000" : "#0b0b0c"; ctx.fillRect(x, y, CELL + 0.5, CELL + 0.5);
        ctx.fillStyle = hot ? "#f2f2f2" : "#2c2c2f"; ctx.fillText(ch[j], x + CELL / 2, y + CELL / 2 + 0.5);

    var vh = window.innerHeight, mid = vh / 2;
    cards.forEach(function (c, i) {
      var r = c.el.getBoundingClientRect(), s = c.el.style;
      if (r.bottom < -vh * 0.5 || r.top > vh * 1.5) return;
