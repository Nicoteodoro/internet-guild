<style>
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --col: min(720px, 100vw - 64px); /* the portfolio column */
    --font: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: clip; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* the band: fixed across the middle of the screen, behind the projects */
  .band {
    position: fixed; top: 50%; left: 20px; right: 20px; z-index: 0; transform: translateY(-50%);
    height: 32px; padding: 0 16px; border-radius: 16px; background: #FF350C; color: #ffffff;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
  }
  .band .name { text-transform: uppercase; }
  .band nav { display: flex; gap: 12px; }
  .band a { transition: opacity .2s ease; }
  .band a:hover { opacity: .7; }
  .band a:focus-visible { outline: 1px solid #ffffff; outline-offset: 3px; }

  /* the portfolio: one centred column that scrolls */
  .reel { list-style: none; margin: 0 auto; padding: 0; width: var(--col); display: flex; flex-direction: column; gap: 72px; }
  /* each card takes its piece's own shape, so the piece fills it edge to edge without cropping;
     tall pieces narrow down to stay within the screen */
  .card {
    position: relative; z-index: 1; aspect-ratio: var(--ar); width: min(100%, 82vh * var(--ar)); margin: 0 auto;
    border-radius: 40px; overflow: hidden; background: #f2f2f2;
  }
  /* the first piece starts in the middle of the screen; the list never ends */
  .card:first-child { margin-top: calc((100svh - min(82vh, var(--col) / var(--ar))) / 2); }
  .card img, .card video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .5s ease;
  }
  .card .loaded { opacity: 1; }

  @media (max-width: 900px) {
    :root { --col: calc(100vw - 32px); }
    .reel { gap: 40px; }
    .card { border-radius: 24px; }
    .band { z-index: 2; } /* the cards fill the width here, so the band rides over them */
  }
</style>
