<style>
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "PP Neue Montreal"; src: url("/neue-montreal-medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --col: min(720px, 100vw - 64px); /* the portfolio column */
    --font: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: clip; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }

  /* the portfolio: one centred column that scrolls */
  .reel { list-style: none; margin: 0 auto; padding: 18vh 0; width: var(--col); display: flex; flex-direction: column; gap: 72px; }
  /* each card takes its piece's own shape, so the piece fills it edge to edge without cropping;
     tall pieces narrow down to stay within the screen */
  .card {
    position: relative; z-index: 1; aspect-ratio: var(--ar); width: min(100%, 82vh * var(--ar)); margin: 0 auto;
    border-radius: 40px; overflow: hidden; background: #f2f2f2;
    transform-origin: 50% 50%; will-change: transform;
  }
  .card img, .card video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .5s ease;
  }
  .card .loaded { opacity: 1; }

  @media (max-width: 900px) {
    :root { --col: calc(100vw - 32px); }
    .reel { padding: 16px 0 96px; gap: 40px; }
    .card { border-radius: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .card { transform: none !important; } }
</style>

  ];

  var reel = document.getElementById("reel"), cards = [];
  var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  for (var k = PROJECTS.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), x = PROJECTS[k]; PROJECTS[k] = PROJECTS[j]; PROJECTS[j] = x; }

  PROJECTS.forEach(function (p) {
    var li = el("li", "card"), m;
    li.style.setProperty("--ar", (p.w / p.h).toFixed(4));
    if (p.type === "video") {
      m = el("video"); m.muted = true; m.loop = true; m.playsInline = true; m.preload = "none";
      m.setAttribute("muted", ""); m.setAttribute("playsinline", ""); if (p.poster) m.poster = p.poster;
    } else { m = el("img"); m.alt = p.desc; m.decoding = "async"; }
    li.appendChild(m); reel.appendChild(li);
    cards.push({ el: li, p: p, m: m, requested: false, inView: false });
  });

  function load(c) {
    if (c.requested) return; c.requested = true;
    var done = function () { c.m.classList.add("loaded"); if (c.p.type === "video" && c.inView && !reduced) c.m.play().catch(function () {}); };
    if (c.p.type === "video") { c.m.addEventListener("loadeddata", done, { once: true }); c.m.src = c.p.src; c.m.load(); }
    else { c.m.addEventListener("load", done, { once: true }); c.m.src = c.p.src; if (c.m.complete && c.m.naturalWidth) done(); }
  }
  if ("IntersectionObserver" in window) {
    var near = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) load(cards[+e.target.dataset.i]); }); }, { rootMargin: "600px 0px" });
    var view = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        var c = cards[+e.target.dataset.i]; c.inView = e.isIntersecting;
        if (c.p.type === "video" && c.m.classList.contains("loaded") && !reduced) { if (c.inView) c.m.play().catch(function () {}); else c.m.pause(); }
      });
    }, { threshold: 0.2 });
    cards.forEach(function (c, i) { c.el.dataset.i = i; near.observe(c.el); view.observe(c.el); });
  } else cards.forEach(load);

  // scroll effects, picked with ?fx=  ·  bend (default) · focus · fold · drum · swing · tunnel · speed
  var FX = ["bend", "focus", "fold", "drum", "swing", "tunnel", "speed"];
  var fx = new URLSearchParams(location.search).get("fx");
  if (FX.indexOf(fx) < 0) fx = "bend";
  document.documentElement.setAttribute("data-fx", fx);
  if (reduced) return;
  function lim(v, m) { return Math.max(-m, Math.min(m, v)); }
  var lastY = window.scrollY, vel = 0;

  function frame() {
    var vh = window.innerHeight, mid = vh / 2, y = window.scrollY;
    vel += ((y - lastY) - vel) * 0.12; lastY = y; // smoothed scroll speed, px per frame
    cards.forEach(function (c, i) {
      var r = c.el.getBoundingClientRect(), s = c.el.style;
      if (r.bottom < -vh * 0.5 || r.top > vh * 1.5) return;
      var e = lim((mid - (r.top + r.height / 2)) / vh, 1), a = Math.abs(e); // e: 1 a screen above the middle … -1 a screen below
      if (fx === "bend") {
        // the cards tilt back as they leave the middle
        s.transform = "perspective(1400px) rotateX(" + (e * 28).toFixed(2) + "deg) scale(" + (1 - a * 0.06).toFixed(3) + ")";
      } else if (fx === "focus") {
        // only the piece in the middle is sharp and in colour; the rest recede
        s.transform = "scale(" + (1 - a * 0.14).toFixed(3) + ")"; s.opacity = (1 - a * 0.55).toFixed(3); s.filter = "grayscale(" + Math.min(1, a * 1.6).toFixed(3) + ")";
      } else if (fx === "fold") {
        // bend and focus together: tilt back, fade and lose colour away from the middle
        s.transform = "perspective(1400px) rotateX(" + (e * 22).toFixed(2) + "deg) scale(" + (1 - a * 0.1).toFixed(3) + ")";
        s.opacity = (1 - a * 0.5).toFixed(3); s.filter = "grayscale(" + Math.min(1, a * 1.6).toFixed(3) + ")";
      } else if (fx === "drum") {
        // the column is the face of a turning drum: pieces roll over the top and under the bottom
        var th = e * 75, rad = th * Math.PI / 180;
        s.transform = "perspective(1100px) translateZ(" + (-(1 - Math.cos(rad)) * 420).toFixed(1) + "px) rotateX(" + th.toFixed(2) + "deg)";
        s.opacity = Math.max(0, Math.cos(rad) * 1.3 - 0.15).toFixed(3);
      } else if (fx === "swing") {
        // pieces swing in from alternate sides, like pages turning, and face you in the middle
        var side = i % 2 ? 1 : -1;
        s.transform = "perspective(1600px) translateX(" + (side * a * 6).toFixed(2) + "vw) rotateY(" + (side * a * 38).toFixed(2) + "deg) scale(" + (1 - a * 0.08).toFixed(3) + ")";
        s.opacity = (1 - a * 0.35).toFixed(3);
      } else if (fx === "tunnel") {
        // pieces rise from the distance, reach you in the middle, and fly past as they leave
        s.transform = "scale(" + (e < 0 ? 1 + e * 0.4 : 1 + e * 0.5).toFixed(3) + ")";
        s.opacity = (e < 0 ? 1 + e * 0.7 : 1 - e * 1.4).toFixed(3);
        s.zIndex = e > 0 ? 2 : 1;
      } else {
        // speed: flat at rest; the column leans and stretches with how fast you scroll, then settles back
        var k = lim(vel * 0.12, 9);
        s.transform = "skewY(" + (-k).toFixed(2) + "deg) scaleY(" + (1 + Math.abs(k) * 0.008).toFixed(3) + ")";
        s.filter = "grayscale(" + Math.min(1, a * 1.6).toFixed(3) + ")";
      }
    });
    requestAnimationFrame(frame);
  }
