  <style>
    html,
    body {
      margin: 0;
    }

    html {
      overflow-y: scroll;
    }

    @font-face {
      font-family: "Work Sans";
      src: url("work-sans-400.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Work Sans";
      src: url("work-sans-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "Work Sans", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: -0.4px;
      font-size: 13px;
      line-height: 15px;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Links underline and go grey under the pointer */
    a {
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color 0.15s ease;
    }

    a:hover {
      color: #949494;
      text-decoration-line: underline;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }

    h1 {
      font-weight: 500;
    }

    button {
      letter-spacing: inherit;
      text-transform: inherit;
    }

    .muted {
      color: #949494;
    }

    /* Two sides on the site's four-column measure: the studio down the
       first half, held to the height of the screen, and the work down
       the last two, one piece under another */
    .page {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding-inline: 20px;
    }

    /* The wordmark at the top, the contacts and the copyright at the foot,
       and the line and the menu held between them */
    .side {
      grid-column: 1 / span 2;
      position: sticky;
      top: 0;
      box-sizing: border-box;
      height: 100vh;
      height: 100dvh;
      padding-block: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* A blank line between the blocks of each group, as typed; the menu
       stands three lines off the text */
    .side p + p {
      margin-top: 15px;
    }

    .about .menu {
      margin-top: 45px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 10px;
    }

    /* The menu reads in grey, so under the pointer it goes black instead */
    .menu a {
      position: relative;
      color: #949494;
    }

    .menu a:hover,
    .menu a[aria-current] {
      color: #000000;
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu > a:not(:last-child)::after {
      content: ",";
    }

    .work {
      grid-column: 3 / -1;
      padding-block: 20px;
    }

    /* The line naming the view, level with the wordmark. It stays at the
       top of the screen, 20 down, while the work runs under it; a white band
       fills the 20 above so nothing shows over it */
    .bar {
      position: sticky;
      top: 20px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding-block: 0 12px;
      background: #ffffff;
    }

    .bar::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100%;
      height: 20px;
      background: #ffffff;
    }

    .count {
      display: flex;
      gap: 12px;
    }

    /* Reads as the text beside it; only the pointer says it is a control */
    .remix {
      appearance: none;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      font: inherit;
      color: #949494;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .remix:hover {
      color: #000000;
    }

    /* One column of work, a piece to a row */
    .index {
      display: grid;
      gap: 24px;
    }

    .cell {
      margin: 0;
      min-width: 0;
    }

    /* Every piece is squared off and cropped to fill */
    .media {
      aspect-ratio: 1 / 1;
      background: #f4f4f4;
      overflow: hidden;
    }

    .media img,
    .media video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Narrower, the page halves: the studio on the left, the work on the right */
    @media (max-width: 900px) {
      .page {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .side {
        grid-column: 1;
      }

      .work {
        grid-column: 2;
      }
    }

    /* On a phone the studio comes first, in the flow, and the work under it */
    /* No work here: the side is the page, in the flow, at least the
       screen's height, its groups kept apart */
    .side {
      align-self: start;
      justify-content: flex-start;
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      position: static;
      gap: 60px;
    }

    /* The content sits right under the wordmark; the foot keeps to the
       bottom of the screen */
    .foot {
      margin-top: auto;
    }

    @media (max-width: 560px) {
      body {
        font-size: 14px;
        line-height: 18px;
      }

      .page {
        grid-template-columns: minmax(0, 1fr);
      }

      .side {
        position: static;
        height: auto;
        min-height: 0;
        gap: 56px;
      }

      .side p + p {
        margin-top: 18px;
      }

      .about .menu {
        margin-top: 54px;
      }

      .work {
        grid-column: 1;
        padding-top: 56px;
      }
    }
  </style>
</head>
