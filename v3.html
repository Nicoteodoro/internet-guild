  <style>
    html,
    body {
      margin: 0;
    }

    /* Geist, self-hosted so the type does not wait on a third party */
    @font-face {
      font-family: Geist;
      src: url("geist-latin.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
                     U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
                     U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: Geist;
      src: url("geist-latin-ext.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
                     U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB,
                     U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Geist, system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 12px;
      line-height: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #111111;
      outline-offset: 2px;
    }

    p,
    h1 {
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
    }

    .muted {
      color: #8a8a8a;
    }

    /* Header and grid share one four-column measure, 12px in from each edge */
    .row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding-inline: 12px;
    }

    .top {
      padding-block: 8px 40px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
    }

    .menu a {
      position: relative;
      color: #8a8a8a;
      transition: color 0.15s ease;
    }

    /* Invisible touch area */
    .menu a::before {
      content: "";
      position: absolute;
      inset: -10px -3px;
    }

    .menu a:hover {
      color: #111111;
    }

    .statement {
      max-width: 34ch;
      text-wrap: pretty;
    }

    /* The one rule on the page, naming the view */
    .bar {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      margin-inline: 12px;
      padding-block: 8px 12px;
      border-top: 1px solid #e6e6e6;
    }

    .index {
      padding-bottom: 8px;
    }

    /* Every piece is squared off and cropped to fill, so the grid never breaks */
    .cell {
      margin: 0;
      aspect-ratio: 1 / 1;
      background: #f4f4f4;
      overflow: hidden;
    }

    .cell img,
    .cell video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 900px) {
      .row {
        grid-template-columns: repeat(2, 1fr);
      }

      .top {
        padding-bottom: 32px;
      }
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }

      .top {
        row-gap: 20px;
      }

      .bar {
        gap: 12px;
      }
    }
  </style>
</head>

  <script>
    // Films play only while on screen, and never with reduced motion
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !reduceMotion.matches) {
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.1 });

    // Posters load about one screen ahead of the scroll
    const posterObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (!isIntersecting) return;
        target.poster = target.dataset.poster;
        observer.unobserve(target);
      });
    }, { rootMargin: '100% 0px 100% 0px' });

    document.querySelectorAll('.cell video').forEach((video) => {
      video.muted = true;
      videoObserver.observe(video);
      if (video.dataset.poster) posterObserver.observe(video);
    });
  </script>
