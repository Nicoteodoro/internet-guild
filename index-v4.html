  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
    }

    html {
      overflow-y: scroll;
    }

    /* Work Sans at 12px for everything, black on white */
    body {
      background: #ffffff;
      color: #000000;
      font-family: "Work Sans", system-ui, sans-serif;
      font-size: 12px;
      line-height: 16px;
      -webkit-font-smoothing: antialiased;
    }

    figure {
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* The menu: three pills fixed at the top, centred, over the work */
    .nav {
      position: fixed;
      top: 46px;
      left: 50%;
      z-index: 2;
      display: flex;
      gap: 4px;
      transform: translateX(-50%);
    }

    .nav a {
      display: flex;
      align-items: center;
      height: 25px;
      padding: 0 11px;
      border-radius: 999px;
      background: #f4f4f4;
      white-space: nowrap;
    }

    .nav .name {
      width: 258px;
      font-weight: 500;
    }

    .nav .about,
    .nav .hire {
      width: 120px;
    }

    .nav .hire {
      background: #ff3b0f;
      color: #ffffff;
    }

    /* The work, one piece at a time down the middle, each at its own
       height, never wider than 800px, 44px apart */
    .work {
      padding: 16px 16px 120px;
    }

    /* The studio, and how to hire it, at 14px, 120px under the menu and 120px over
       the first piece (the script places them) */
    .work {
      position: relative;
    }

    .intro {
      position: absolute;
      left: 16px;
      right: 16px;
      margin: 0;
      font-size: 14px;
      line-height: 18px;
      text-align: center;
    }

    .intro p {
      margin: 0;
    }

    .intro p + p {
      margin-top: 18px;
    }

    .intro a:hover {
      text-decoration-line: underline;
      text-underline-offset: 3px;
    }

    .project {
      width: min(800px, 100%);
      margin: 0 auto;
    }

    .project + .project {
      margin-top: 44px;
    }

    /* Never taller than most of the screen; a tall piece narrows instead */
    .project img,
    .project video {
      display: block;
      width: min(100%, calc(80vh * var(--r)));
      height: auto;
      aspect-ratio: var(--r);
      margin: 0 auto;
      border-radius: 32px;
      background: #ececec;
    }

    @media (max-width: 520px) {
      .nav {
        top: 16px;
        width: calc(100% - 32px);
      }

      .nav .name {
        flex: 1;
        width: auto;
      }

      .nav .about {
        width: 64px;
      }

      .nav .hire {
        width: 104px;
      }
    }
  </style>
</head>

  <script>
    // The words 120px under the menu, the first piece 120px under them
    const work = document.querySelector('.work');
    const nav = document.querySelector('.nav');
    const intro = document.querySelector('.intro');
    function place() {
      const navBottom = nav.getBoundingClientRect().bottom;
      intro.style.top = (navBottom + 120) + 'px';
      work.style.paddingTop = (navBottom + 120 + intro.offsetHeight + 120) + 'px';
    }
    place();
    addEventListener('resize', place);
    document.fonts.ready.then(place);

    // Films load and play only while they are on screen, and never with
    // reduced motion
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const films = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !still.matches) {
          if (!target.src) target.src = target.dataset.src;
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.project video').forEach((video) => {
      video.muted = true;
      films.observe(video);
    });
  </script>
