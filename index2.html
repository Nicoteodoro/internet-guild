  <style>
    html,
    body {
      margin: 0;
    }

    /* Inter for now, all of it: one size, one weight; black for what things
       are called, grey for what is said about them */
    body {
      background: #ffffff;
      color: #000000;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      line-height: 24px;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p,
    h1,
    h2 {
      margin: 0;
      font: inherit;
    }

    /* The name at the top left, Contact at the top right, 17 in */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 17px 0;
    }

    .top a:hover {
      color: #8c8c8c;
    }

    /* The wordmark, as tall as a capital of the text beside it */
    .wordmark {
      display: block;
      width: auto;
      height: 12px;
    }

    /* What the studio is, in grey, two short paragraphs; a link in it in black */
    .intro {
      max-width: 520px;
      padding: 64px 17px 0;
      color: #8c8c8c;
    }

    .intro p + p {
      margin-top: 16px;
    }

    .intro a {
      color: #000000;
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    /* The work: a packed grid, eight columns on a wide screen, fewer as it
       narrows. A piece takes one column, or two for the ones that lead; each
       keeps its own shape, its caption under it in small capitals, and the
       grid closes up under it, column by column */
    .work {
      --cols: 8;
      --gap: 10px;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-auto-rows: 1px;
      grid-auto-flow: row dense;
      column-gap: var(--gap);
      padding: 132px 5px 64px;
    }

    .item {
      margin: 0;
      grid-row-end: span var(--rows, 300);
    }

    .item.wide {
      grid-column-end: span 2;
    }

    .frame {
      aspect-ratio: var(--ar);
      background: #ececec;
    }

    .frame img,
    .frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item figcaption {
      padding-top: 10px;
      font-size: 11px;
      line-height: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 1599px) {
      .work {
        --cols: 6;
      }
    }

    @media (max-width: 1199px) {
      .work {
        --cols: 4;
      }
    }

    @media (max-width: 700px) {
      body {
        font-size: 15px;
        line-height: 22px;
      }

      .intro {
        padding-top: 48px;
      }

      .work {
        --cols: 2;
        --gap: 8px;
        padding-top: 88px;
      }

      .item figcaption {
        font-size: 10px;
      }
    }
  </style>

  <script>
    // Films load and play only while they are on screen, and never with
    // reduced motion
    const still = matchMedia('(prefers-reduced-motion: reduce)');
    const films = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !still.matches) {
          if (!target.src) target.src = target.dataset.src;
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.2 });

    // The packing: each piece takes as many one-pixel rows as it is tall,
    // with the room under it, so the next one in its column starts right
    // under its caption
    const work = document.querySelector('.work');
    const items = [...work.querySelectorAll('.item')];
    const ROOM = 26;

    function pack() {
      items.forEach((item) => {
        item.style.setProperty('--rows', Math.ceil(item.firstElementChild.offsetHeight + item.lastElementChild.offsetHeight + ROOM));
      });
    }

    pack();
    addEventListener('resize', pack);
    document.fonts.ready.then(pack);

    document.querySelectorAll('.frame video').forEach((video) => {
      video.muted = true;
      films.observe(video);
    });
  </script>
