<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Works · Internet Guild</title>
<meta name="description" content="Selected websites, products and AI work by Internet Guild.">
<meta name="theme-color" content="#000000">
<link rel="preload" href="/neue-montreal-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/neue-montreal-medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* PP Neue Montreal, self-hosted: Regular for the words, Medium for the name and the buttons */
  @font-face {
    font-family: "PP Neue Montreal";
    src: url("/neue-montreal-regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "PP Neue Montreal";
    src: url("/neue-montreal-medium.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  /* small icon on top, a prompt line that filters, a two-column grid of equal 4:5 tiles, a closing call to hire */
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --fg-dim: rgba(255, 255, 255, 0.86);
    --muted: #7c7c80;
    --line: #1c1c1e;
    --line-hi: #2a2a2d;
    --tile: #0b0b0c;
    --ratio: 4 / 3; /* tile shape: 4 / 3 keeps 25-30 projects scannable; 4 / 5 for taller tiles */
    --font-name: "PP Neue Montreal", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-name);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    width: min(1120px, 100%);
    margin: 0 auto;
    padding-block: max(40px, env(safe-area-inset-top, 0px)) max(64px, env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  /* soft cross-page transition: the icon stays put, the rest crossfades */
  @view-transition { navigation: auto; }
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .3s; }
  ::view-transition-group(mark) { animation-duration: .3s; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  }
  .mark {
    width: 320px;
    max-width: 100%;
    margin: 0 auto;
    view-transition-name: mark;
  }
  .mark { margin: 0 auto; view-transition-name: mark; }
  .mark.mark-sm { width: 88px; }
  .home { display: block; width: 88px; margin: 0 auto; border-radius: 0; }
  .home:focus-visible { outline: 1px solid var(--fg); outline-offset: 6px; }

  /* back to the index, the prompt line, and remix at the right */
  .bar {
    margin-top: 40px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
  }
  .cmdline { display: flex; align-items: baseline; gap: 0; font-size: 14px; letter-spacing: -0.01em; min-width: 0; }
  .ps { color: var(--muted); margin-right: 8px; user-select: none; }
  .cmd { color: var(--fg); white-space: pre; }
  .scr { color: var(--muted); }
  .cursor {
    display: inline-block; flex: none; width: 8px; height: 15px; margin-left: 2px;
    background: var(--fg); transform: translateY(2px); animation: blink 1.05s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .count { margin-left: 14px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .left { display: flex; align-items: baseline; gap: 28px; min-width: 0; flex-wrap: wrap; }
  .back { color: var(--fg); font-size: 14px; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
  .back:hover { text-decoration: underline; text-underline-offset: 3px; }
  .back:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  .chip {
    display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 0; border-radius: 0; cursor: pointer;
    font: 500 12px/26px var(--font-name); letter-spacing: -0.01em; text-decoration: none; white-space: nowrap;
    color: var(--muted); background: var(--line); transition: background-color .2s ease, color .2s ease;
  }
  .chip:hover { color: var(--fg); background: var(--line-hi); }
  .chip:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }

  /* grid */
  .grid {
    list-style: none; margin: 20px 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 8px;
  }
  .tile { min-width: 0; }
  .frame {
    position: relative; display: block; width: 100%; aspect-ratio: var(--ratio); max-width: 100%;
    padding: 0; border: 0; border-radius: 0; overflow: hidden; cursor: pointer;
    background: var(--tile);
  }
  .frame:focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  .frame img, .frame video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .4s ease, filter .5s ease, transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .frame .loaded { opacity: 1; }
  @media (hover: hover) {
    .frame img, .frame video { filter: grayscale(1) brightness(.78); }
    .tile:hover .frame img, .tile:hover .frame video,
    .frame:focus-visible img, .frame:focus-visible video { filter: none; transform: scale(1.015); }
  }
  .veil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .tag-video {
    position: absolute; top: 10px; right: 10px; z-index: 1;
    font-size: 11px; line-height: 1; color: var(--fg-dim); letter-spacing: 0;
    display: flex; align-items: center; gap: 6px; opacity: .85; text-shadow: 0 0 6px rgba(0,0,0,.8);
  }
  .tag-video::before { content: ""; width: 6px; height: 6px; background: currentColor; }
  .cap {
    margin-top: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    font-size: 13px; letter-spacing: -0.01em; line-height: 1.3;
  }
  .cap .name { color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cap .meta { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* closing */
  .outro { margin-top: 88px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  .outro p { margin: 0; font-size: 14px; line-height: 1.4; color: var(--fg-dim); }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 34px;
    padding: 0 16px;
    font-family: var(--font-name);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.01em;
    text-decoration: none;
    border-radius: 0;
    transition: background-color .2s ease, color .2s ease;
  }
  .btn-primary { background: #ffffff; color: #000000; }
  .btn-primary:hover { background: #e4e4e4; }
  .btn-secondary { background: #1c1c1e; color: #ffffff; }
  .btn-secondary:hover { background: #2a2a2d; }
  .btn:focus-visible { outline: 1px solid #ffffff; outline-offset: 3px; }

  /* full-screen viewer */
  .viewer {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 16px;
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
    animation: vin .25s ease both;
  }
  @keyframes vin { from { opacity: 0; } }
  .v-top, .v-bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; letter-spacing: -0.01em; }
  .v-bottom { align-items: flex-end; flex-wrap: wrap; }
  .v-count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .v-stage { min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
  .v-stage img, .v-stage video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .v-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: 60ch; }
  .v-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .v-name { color: var(--fg); font-size: 14px; font-weight: 500; }
  .v-meta { color: var(--muted); font-size: 12px; }
  .v-desc { margin: 0; color: var(--fg-dim); line-height: 1.4; }
  .v-desc a { color: var(--fg); }
  .v-nav { display: flex; gap: 6px; }
  .vbtn {
    height: 28px; padding: 0 10px; border: 0; border-radius: 0; cursor: pointer;
    font: 500 12px/28px var(--font-name); letter-spacing: -0.01em;
    color: var(--fg); background: var(--line); transition: background-color .2s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .vbtn:hover { background: var(--line-hi); }
  .vbtn:focus-visible { outline: 1px solid var(--fg); outline-offset: 2px; }
  .vbtn kbd { font: inherit; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .viewer { animation: none; }
    .frame img, .frame video { transition: opacity .2s ease; }
  }
  @media (max-width: 640px) {
    .grid { gap: 20px 6px; }
    .cap { flex-direction: column; align-items: flex-start; gap: 2px; margin-top: 8px; font-size: 12px; }
    .cap .meta { font-size: 11px; }
    .tag-video { top: 6px; right: 6px; font-size: 10px; }
    .bar { margin-top: 32px; }
    .vbtn kbd { display: none; }
  }
</style>
</head>

<script>

        if (t.p.type === "video" && t.loaded && !reduced) { if (t.inView && !viewerOpen) t.media.play().catch(function () {}); else t.media.pause(); }
      });
    }, { threshold: 0.2 });
    tiles.forEach(function (t) { t.btn.dataset.i = t.i; near.observe(t.btn); view.observe(t.btn); });
  } else tiles.forEach(function (t) { t.inView = true; t.seenAt = performance.now(); request(t); });

  // ── remix: the same work, dealt again in a new order ──
  function visible() { return [].map.call(grid.children, function (li) { return tiles[+li.dataset.i]; }); }
  tiles.forEach(function (t) { t.el.dataset.i = t.i; });
  count.textContent = plural(tiles.length);
  remix.addEventListener("click", function () {
    decode(cmd, "works --remix");
    function update() { shuffle(visible()).forEach(function (t) { grid.appendChild(t.el); }); }
    if (document.startViewTransition && !reduced) {
      tiles.forEach(function (t) { t.el.style.viewTransitionName = "tile-" + t.i; });
      var vt = document.startViewTransition(update);
      vt.finished.finally(function () { tiles.forEach(function (t) { t.el.style.viewTransitionName = ""; }); });
    } else update();
  });

  // ── viewer ──
  var viewer = document.getElementById("viewer"), stage = document.getElementById("v-stage"),
      vName = document.getElementById("v-name"), vMeta = document.getElementById("v-meta"),
      vDesc = document.getElementById("v-desc"), vCount = document.getElementById("v-count"),
      vClose = document.getElementById("v-close"), list = [], pos = 0, opener = null;
  function pad(n) { return String(n).padStart(2, "0"); }
  function show(k) {
    pos = (k + list.length) % list.length;
    var p = list[pos].p, m;
    stage.textContent = "";
    if (p.type === "video") {
      m = el("video"); m.muted = true; m.loop = true; m.playsInline = true; m.autoplay = !reduced; m.controls = reduced;
      m.setAttribute("muted", ""); m.setAttribute("playsinline", ""); if (p.poster) m.poster = p.poster; m.src = p.src;
    } else { m = el("img"); m.alt = p.client; m.src = p.src; }
    stage.appendChild(m);
    if (p.type === "video" && !reduced) m.play().catch(function () {});
    vCount.textContent = pad(pos + 1) + " / " + pad(list.length);
    decode(vName, p.client); vMeta.textContent = meta(p);
    vDesc.textContent = p.desc || "Placeholder. One line about the work: what it was and what changed.";
    if (p.url) { vDesc.appendChild(document.createTextNode(" ")); var a = el("a", null, "Visit site \u2197"); a.href = p.url; a.target = "_blank"; a.rel = "noopener"; vDesc.appendChild(a); }
  }
  function openViewer(t) {
    list = visible(); opener = t.btn; viewerOpen = true;
    tiles.forEach(function (x) { if (x.p.type === "video") x.media.pause(); });
    show(list.indexOf(t)); viewer.hidden = false;
    document.documentElement.style.overflow = "hidden"; vClose.focus();
  }
  function closeViewer() {
    viewer.hidden = true; stage.textContent = ""; viewerOpen = false;
    document.documentElement.style.overflow = "";
    tiles.forEach(function (x) { if (x.p.type === "video" && x.loaded && x.inView && !reduced) x.media.play().catch(function () {}); });
    if (opener) opener.focus({ preventScroll: true });
  }
  vClose.addEventListener("click", closeViewer);
  document.getElementById("v-prev").addEventListener("click", function () { show(pos - 1); });
  document.getElementById("v-next").addEventListener("click", function () { show(pos + 1); });
  document.addEventListener("keydown", function (e) {
    if (viewer.hidden) return;
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") show(pos + 1);
    else if (e.key === "ArrowLeft") show(pos - 1);
    else if (e.key === "Tab") { // keep focus inside the viewer
      var f = viewer.querySelectorAll("button, a[href]"), first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  var tx = null;
  stage.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", function (e) {
    if (tx === null) return; var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) show(pos + (dx < 0 ? 1 : -1));
  });
})();
</script>
</body>
</html>
