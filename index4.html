  <script>
    // The page comes in: while the class is on, everything waits to be shown.
    // Not with reduced motion; and if the script below never starts, the
    // page shows itself after a few seconds all the same
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro');
      setTimeout(() => {
        if (!window.introStarted) document.documentElement.classList.remove('intro');
      }, 6000);
    }
  </script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* PP Neue Montreal Medium, self-hosted: the one face the page uses */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 11px;
      line-height: 14px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    a {
      color: inherit;
      text-decoration: none;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-line: underline;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p {
      margin: 0;
    }

    /* The page is one screen tall and does not move. Its words stand 13 in
       from the edges: the name at the top left, the studio's words in the
       middle of the page, starting where the name ends; the address at the
       foot, to the right; the menu at the top right. The work runs down the middle in a
       column of its own, the only thing that scrolls; a wheel turned anywhere
       on the page moves it */
    .menu {
      position: fixed;
      top: 13px;
      right: 13px;
      display: flex;
      gap: 21px;
      color: #000000;
      z-index: 2;
    }

    /* A black square, 4 by 4, stands before each word */
    .menu a {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu a::before {
      content: "";
      flex: none;
      width: 4px;
      height: 4px;
      background: #000000;
    }

    /* One grid over the page, 13 in from every edge: the first column is as
       wide as the name, so the words start exactly where the name ends, and
       they stand in the middle of the page's height. The grid itself lets
       the page through */
    .studio {
      position: fixed;
      inset: 13px;
      display: grid;
      grid-template-columns: max-content 1fr;
      grid-template-rows: auto 1fr;
      pointer-events: none;
    }

    .studio > * {
      pointer-events: auto;
    }

    .studio > p {
      grid-column: 1;
      grid-row: 1;
      white-space: nowrap;
    }

    .studio > div {
      grid-column: 2;
      grid-row: 1 / -1;
      align-self: center;
      color: #a9a9a9;
    }

    .studio p + p {
      margin-top: 64px;
    }

    .hire {
      position: fixed;
      right: 13px;
      bottom: 13px;
      text-align: right;
    }

    /* 36.6% of the screen's width (three sevenths less a tenth and then a
       twentieth), in the middle of the page (over
       the words, if they meet), and from the top edge to the bottom one: the
       pieces run flush to both, 30 apart */
    .works {
      position: fixed;
      top: 0;
      bottom: 0;
      left: calc(50vw - 100vw * 513 / 2800);
      width: calc(100vw * 513 / 1400);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      touch-action: pan-y;
    }

    .works::-webkit-scrollbar {
      display: none;
    }

    .piece {
      aspect-ratio: var(--ar, 1 / 1);
      overflow: hidden;
    }

    .piece + .piece {
      margin-top: 30px;
    }

    .piece img,
    .piece video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #d9d9d9;
    }

    /* The way in. The pieces come first: the column opens with one piece in
       the middle of the screen and one above, one below it. All three begin
       tiny and blurred in the heart of the middle one. First the other two
       slip out from behind it, still tiny, the one that belongs above going
       up and the one that belongs below going down; then all three grow
       together, and settle into their places sharp. (The motion itself is
       drawn by the script; here is only where a piece waits and where it
       rests.) Then the words rise into place, the menu, the studio, the
       address. The rest of the pieces take no part: they are simply there
       when the visitor comes to them. Nothing hides unless the page asked for
       it (the class on the root) */
    .reveal {
      transition: opacity 0.9s ease var(--delay, 0s), transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) var(--delay, 0s);
    }

    html.intro .reveal {
      opacity: 0;
      transform: translateY(10px);
    }

    html.intro .piece {
      opacity: 0;
    }

    html.intro .piece.start,
    html.intro .piece.is-in {
      position: relative;
      z-index: 1;
    }

    html.intro .piece.middle {
      z-index: 2;
    }

    html.intro .piece.is-in {
      opacity: 1;
    }

    html.intro .piece.plain {
      opacity: 1;
    }

    html.intro .reveal.is-in {
      opacity: 1;
      transform: none;
    }

    /* On a phone the words keep the top and the work takes the lower half;
       a window that is narrow but short keeps the two columns */
    @media (max-width: 800px) and (min-height: 561px) {
      .menu {
        gap: 12px;
      }

      .studio {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        align-content: start;
      }

      .studio > div {
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        margin-top: 35px;
      }

      .studio p + p {
        margin-top: 16px;
      }

      .hire {
        display: none;
      }

      .works {
        top: auto;
        height: 56vh;
        left: 13px;
        right: 13px;
        width: auto;
      }
    }
  </style>
</head>
<body>

  <script>
    // Films play only while on screen, and never with reduced motion
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const works = document.querySelector('.works');

    // The work comes in a different order every time the page is entered. The
    // page opens on three of them, one in the middle of the screen with one
    // above and one below, so the one in the middle is the first that leaves
    // room for the other two to show
    (() => {
      const pieces = [...works.children];
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }

      const room = works.clientHeight * 0.7;
      const middle = pieces.find((piece) => piece.offsetHeight <= room)
        || pieces.reduce((a, b) => (a.offsetHeight <= b.offsetHeight ? a : b));
      pieces.splice(pieces.indexOf(middle), 1);
      pieces.splice(1, 0, middle);
      works.append(...pieces);

      // Whatever lands first is wanted straight away
      pieces.slice(0, 4).forEach((piece) => {
        const image = piece.querySelector('img');
        if (image) image.loading = 'eager';
      });
    })();

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !reduceMotion.matches) {
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.1 });

    // Posters load about one screen ahead of the scroll
    const posterObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (!isIntersecting) return;
        target.poster = target.dataset.poster;
        observer.unobserve(target);
      });
    }, { rootMargin: '100% 0px 100% 0px' });

    works.querySelectorAll('video').forEach((video) => {
      video.muted = true;
      videoObserver.observe(video);
      if (video.dataset.poster) posterObserver.observe(video);
    });

    // The way in: the column opens with its second piece in the middle of the
    // screen, so one piece shows above it and one below. Once their pictures
    // are there, all that are on screen begin as a tiny heap in the heart of
    // the middle one. First the others slip out from behind it, still tiny, to
    // the middle of what shows of each; then all grow together, to their
    // places, and the blur clears as they land. The rest are left as they
    // are, with no effect, for when the visitor comes to them. When the last
    // of those that grew is nearly sharp the words rise, in the order they
    // stand on the page. The column starts to move once all of it is in
    const root = document.documentElement;
    let opening = document.fonts.ready;

    if (root.classList.contains('intro')) {
      window.introStarted = true;

      const SMALL = 0.08;        // how small they begin, of their size
      const BLUR = 14;           // how blurred they begin, in pixels
      const OUT_TIME = 1.1;      // seconds the others take to slip out, still tiny
      const GROW_TIME = 2.4;     // seconds all take to grow, together
      const TEXTS_AT = 2.5;      // seconds, once the pieces have begun
      const SLIP = 'cubic-bezier(0.5, 0, 0.2, 1)';
      const GROW = 'cubic-bezier(0.4, 0.1, 0.15, 1)';
      const CLEAR = 'cubic-bezier(0.5, 0, 0.3, 1)';
      const texts = [...document.querySelectorAll('.reveal')];
      const pieces = [...works.children];

      const pictureReady = (piece) => new Promise((resolve) => {
        const video = piece.querySelector('video');
        let image = piece.querySelector('img');
        if (video && video.dataset.poster) {
          video.poster = video.dataset.poster;
          image = new Image();
          image.src = video.dataset.poster;
        }
        if (!image || image.complete) return resolve();
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', resolve, { once: true });
        setTimeout(resolve, 1500);
      });

      // One piece's way in: tiny in the heart of the middle one, then tiny
      // where it will first be seen, then grown into its place
      const open = (piece, from, out) => {
        piece.classList.remove('start');
        piece.classList.add('is-in');
        if (!piece.animate) return;

        const tiny = ([x, y]) => `translate(${x}px, ${y}px) scale(${SMALL})`;
        const at = OUT_TIME / (OUT_TIME + GROW_TIME);
        const run = (frames, duration = (OUT_TIME + GROW_TIME) * 1000) => {
          const motion = piece.animate(frames, { duration, fill: 'both' });
          motion.finished.then(() => motion.cancel()).catch(() => {});
        };

        run([
          { transform: tiny(from), easing: SLIP },
          { transform: tiny(out), offset: at, easing: GROW },
          { transform: 'none' },
        ]);
        run([
          { filter: `blur(${BLUR}px)` },
          { filter: `blur(${BLUR}px)`, offset: at, easing: CLEAR },
          { filter: 'blur(0px)' },
        ]);
        run([{ opacity: 0 }, { opacity: 1 }], 500);
      };

      opening = document.fonts.ready.then(() => {
        const middle = pieces[1];
        const column = works.getBoundingClientRect();

        // The column opens with the middle piece in the middle of the screen
        works.scrollTop = Math.max(0, middle.offsetTop + middle.offsetHeight / 2 - works.clientHeight / 2);
        current = target = ours = works.scrollTop;

        const first = pieces.filter((piece) => {
          const box = piece.getBoundingClientRect();
          return box.bottom > column.top && box.top < column.bottom;
        });
        pieces.filter((piece) => !first.includes(piece)).forEach((piece) => piece.classList.add('plain'));

        // Where each begins (the heart of the middle one) and where it first
        // shows (the middle of what is on screen of it), as how far each has
        // to move from its place; the middle one does not move
        const heart = middle.getBoundingClientRect();
        const way = new Map();
        first.forEach((piece) => {
          const box = piece.getBoundingClientRect();
          const x = box.left + box.width / 2;
          const y = box.top + box.height / 2;
          const shownX = (Math.max(box.left, column.left) + Math.min(box.right, column.right)) / 2;
          const shownY = (Math.max(box.top, column.top) + Math.min(box.bottom, column.bottom)) / 2;
          way.set(piece, piece === middle
            ? { from: [0, 0], out: [0, 0] }
            : {
              from: [heart.left + heart.width / 2 - x, heart.top + heart.height / 2 - y],
              out: [shownX - x, shownY - y],
            });
          piece.classList.add('start');
        });
        middle.classList.add('middle');

        // All of them go together, once every picture is there
        return Promise.all(first.map(pictureReady)).then(() => {
          first.forEach((piece) => open(piece, way.get(piece).from, way.get(piece).out));

          texts.forEach((text, i) => {
            text.style.setProperty('--delay', `${TEXTS_AT + i * 0.09}s`);
            text.classList.add('is-in');
          });

          START_AFTER = Math.round((TEXTS_AT + texts.length * 0.09 + 0.9) * 1000);
        });
      });
    }

    // The column moves by itself once the page has loaded, at a slow, steady
    // pace. The first wheel turn, touch or key, anywhere on the page, takes it
    // out of the page's hands: from then on the visitor moves it, and the
    // wheel is eased, so the column glides to where it was sent instead of
    // jumping there
    const AUTO_SPEED = 40;     // pixels a second
    const EASE = 0.085;        // share of the way covered each frame
    let START_AFTER = 700;     // ms after load

    let target = 0;
    let current = 0;
    let auto = !reduceMotion.matches;
    let last = 0;
    let running = false;
    let ours = 0;

    const limit = () => works.scrollHeight - works.clientHeight;
    const clamp = (y) => Math.max(0, Math.min(limit(), y));

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0);
      last = now;

      if (auto) target = clamp(target + AUTO_SPEED * dt);
      current += (target - current) * (1 - Math.pow(1 - EASE, dt * 60));
      if (Math.abs(target - current) < 0.1) current = target;

      ours = current;
      works.scrollTop = current;

      if (auto && target >= limit()) auto = false;
      if (auto || current !== target) requestAnimationFrame(frame);
      else running = false;
    }

    function run() {
      if (running) return;
      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    }

    function takeOver() {
      auto = false;
    }

    addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      e.preventDefault();
      takeOver();
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? works.clientHeight : 1;
      target = clamp(target + e.deltaY * unit);

      if (reduceMotion.matches) {
        current = ours = works.scrollTop = target;
      } else {
        run();
      }
    }, { passive: false });

    // A finger dragged anywhere but on the column moves the column too
    let finger = null;

    addEventListener('touchstart', (e) => {
      takeOver();
      finger = works.contains(e.target) ? null : e.touches[0].clientY;
    }, { passive: true });

    addEventListener('touchmove', (e) => {
      if (finger === null) return;
      const y = e.touches[0].clientY;
      works.scrollTop = clamp(works.scrollTop + finger - y);
      current = target = ours = works.scrollTop;
      finger = y;
    }, { passive: true });

    addEventListener('keydown', (e) => {
      if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End', ' '].includes(e.key)) takeOver();
    });

    // Anything that moves the column but us (touch, keys, a drag) is the
    // visitor's: follow it
    works.addEventListener('scroll', () => {
      if (Math.abs(works.scrollTop - ours) > 1.5) {
        takeOver();
        current = target = ours = works.scrollTop;
      }
    }, { passive: true });

    opening.then(() => {
      if (!auto) return;
      setTimeout(() => {
        if (auto) {
          current = target = works.scrollTop;
          run();
        }
      }, START_AFTER);
    });
  </script>
