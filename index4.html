  <script>
    // The page comes in: while the class is on, everything waits to be shown.
    // Not with reduced motion; and if the script below never starts, the
    // page shows itself after a few seconds all the same
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro');
      setTimeout(() => {
        if (!window.introStarted) document.documentElement.classList.remove('intro');
      }, 6000);
    }
  </script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* PP Neue Montreal Medium, self-hosted: the one face the page uses */
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("neue-montreal-medium.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: "PP Neue Montreal", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 12px;
      line-height: 14px;
      text-transform: uppercase;
      -webkit-font-smoothing: antialiased;
      touch-action: none;
    }

    a {
      color: inherit;
      text-decoration: none;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration-line: underline;
    }

    a:focus-visible {
      outline: 1px solid #000000;
      outline-offset: 2px;
    }

    p {
      margin: 0;
    }

    /* The page is one screen tall and does not move. Its words stand on the
       left, 13 in from the edges: the menu at the top, the studio in the
       middle, the address at the foot. The work runs down the right in a
       column of its own, the only thing that scrolls; a wheel turned anywhere
       on the page moves it */
    /* The menu is set back: black at 30% */
    .menu {
      position: fixed;
      top: 13px;
      left: 13px;
      display: flex;
      gap: 42px;
      color: rgba(0, 0, 0, 0.3);
    }

    /* The label's column shrinks with the screen */
    .studio {
      position: fixed;
      top: max(45.4vh, 60px);
      left: 13px;
      right: 13px;
      display: grid;
      grid-template-columns: clamp(110px, 14vw, 210px) 1fr;
      column-gap: 13px;
    }

    .studio p + p {
      margin-top: 32px;
    }

    .hire {
      position: fixed;
      left: 13px;
      bottom: 13px;
    }

    /* Twenty-seven seventieths of the screen's width (three sevenths less a
       tenth), in the middle of the page (over
       the words, if they meet), and from the top edge to the bottom one: the
       pieces run flush to both, 30 apart */
    .works {
      position: fixed;
      top: 0;
      bottom: 0;
      left: calc(50vw - 100vw * 27 / 140);
      width: calc(100vw * 27 / 70);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      touch-action: pan-y;
    }

    .works::-webkit-scrollbar {
      display: none;
    }

    .piece {
      aspect-ratio: var(--ar, 1 / 1);
      overflow: hidden;
    }

    .piece + .piece {
      margin-top: 30px;
    }

    .piece img,
    .piece video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #d9d9d9;
    }

    /* A short window: the studio sits just under the menu, so a tall list
       never reaches the address */
    @media (max-height: 560px) {
      .studio {
        top: 60px;
      }
    }

    /* The way in. The pieces come first: each grows from a small, blurred
       square in the middle of its place up to its full size, the blur
       clearing as it nears it, so it lands sharp. The ones on screen go one
       after another, the rest as they arrive. Then the words rise into place,
       the menu, the studio, the address. Only the pieces on screen at the
       start do this; the rest show as they are. The grown thing is the
       picture, the piece around it holds its place. Nothing hides unless
       the page asked for it (the class on the root) */
    .piece img,
    .piece video {
      transition: transform 1.6s cubic-bezier(0.25, 0.6, 0.3, 1) var(--delay, 0s),
        filter 1.6s cubic-bezier(0.5, 0, 0.3, 1) var(--delay, 0s),
        opacity 0.5s ease-out var(--delay, 0s);
    }

    .reveal {
      transition: opacity 0.9s ease var(--delay, 0s), transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) var(--delay, 0s);
    }

    html.intro .piece img,
    html.intro .piece video {
      transform: scale(0.28);
      filter: blur(22px);
      opacity: 0;
    }

    /* The pieces below the fold take no part in it: they are simply there
       when the visitor comes to them */
    html.intro .piece.plain img,
    html.intro .piece.plain video {
      transition: none;
      transform: none;
      filter: none;
      opacity: 1;
    }

    html.intro .reveal {
      opacity: 0;
      transform: translateY(10px);
    }

    html.intro .piece.is-in img,
    html.intro .piece.is-in video {
      transform: none;
      filter: blur(0);
      opacity: 1;
    }

    html.intro .reveal.is-in {
      opacity: 1;
      transform: none;
    }

    /* On a phone the words keep the top and the work takes the lower half;
       a window that is narrow but short keeps the two columns */
    @media (max-width: 800px) and (min-height: 561px) {
      .menu {
        gap: 24px;
      }

      .studio {
        top: 62px;
        grid-template-columns: 1fr;
        gap: 16px;
        right: 13px;
      }

      .studio p + p {
        margin-top: 16px;
      }

      .hire {
        display: none;
      }

      .works {
        top: auto;
        height: 56vh;
        left: 13px;
        right: 13px;
        width: auto;
      }
    }
  </style>
</head>

  <script>
    // Films play only while on screen, and never with reduced motion
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const works = document.querySelector('.works');

    // The work comes in a different order every time the page is entered
    (() => {
      const pieces = [...works.children];
      for (let i = pieces.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
      }
      works.append(...pieces);

      // Whatever lands first is wanted straight away
      pieces.slice(0, 4).forEach((piece) => {
        const image = piece.querySelector('img');
        if (image) image.loading = 'eager';
      });
    })();

    const videoObserver = new IntersectionObserver((entries) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (isIntersecting && !reduceMotion.matches) {
          target.play().catch(() => {});
        } else {
          target.pause();
        }
      });
    }, { threshold: 0.1 });

    // Posters load about one screen ahead of the scroll
    const posterObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(({ target, isIntersecting }) => {
        if (!isIntersecting) return;
        target.poster = target.dataset.poster;
        observer.unobserve(target);
      });
    }, { rootMargin: '100% 0px 100% 0px' });

    works.querySelectorAll('video').forEach((video) => {
      video.muted = true;
      videoObserver.observe(video);
      if (video.dataset.poster) posterObserver.observe(video);
    });

    // The way in: the pieces on screen at the start grow one after another,
    // 140 ms apart, each once its picture is there; the rest are left as they
    // are, with no effect, for when the visitor comes to them. When the last
    // of those that grew is nearly sharp the words rise, in the order they
    // stand on the page. The column starts to move once all of it is in
    const root = document.documentElement;

    if (root.classList.contains('intro')) {
      window.introStarted = true;

      const STEP = 0.14;
      const texts = [...document.querySelectorAll('.reveal')];
      const pieces = [...works.children];

      const pictureReady = (piece) => new Promise((resolve) => {
        const image = piece.querySelector('img');
        if (!image || image.complete) return resolve();
        image.addEventListener('load', resolve, { once: true });
        image.addEventListener('error', resolve, { once: true });
        setTimeout(resolve, 1500);
      });

      const open = (piece, delay) => {
        piece.style.setProperty('--delay', `${delay}s`);
        pictureReady(piece).then(() => piece.classList.add('is-in'));
      };

      document.fonts.ready.then(() => {
        const height = works.clientHeight;
        const first = pieces.filter((piece) => piece.getBoundingClientRect().top < height);
        const rest = pieces.filter((piece) => !first.includes(piece));

        first.forEach((piece, i) => open(piece, i * STEP));
        rest.forEach((piece) => piece.classList.add('plain'));

        const textsAt = first.length * STEP + 1.25;
        texts.forEach((text, i) => {
          text.style.setProperty('--delay', `${textsAt + i * 0.09}s`);
          text.classList.add('is-in');
        });

        START_AFTER = Math.round((textsAt + texts.length * 0.09 + 0.9) * 1000);
      });
    }

    // The column moves by itself once the page has loaded, at a slow, steady
    // pace. The first wheel turn, touch or key, anywhere on the page, takes it
    // out of the page's hands: from then on the visitor moves it, and the
    // wheel is eased, so the column glides to where it was sent instead of
    // jumping there
    const AUTO_SPEED = 40;     // pixels a second
    const EASE = 0.085;        // share of the way covered each frame
    let START_AFTER = 700;     // ms after load

    let target = 0;
    let current = 0;
    let auto = !reduceMotion.matches;
    let last = 0;
    let running = false;
    let ours = 0;

    const limit = () => works.scrollHeight - works.clientHeight;
    const clamp = (y) => Math.max(0, Math.min(limit(), y));

    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0);
      last = now;

      if (auto) target = clamp(target + AUTO_SPEED * dt);
      current += (target - current) * (1 - Math.pow(1 - EASE, dt * 60));
      if (Math.abs(target - current) < 0.1) current = target;

      ours = current;
      works.scrollTop = current;

      if (auto && target >= limit()) auto = false;
      if (auto || current !== target) requestAnimationFrame(frame);
      else running = false;
    }

    function run() {
      if (running) return;
      running = true;
      last = performance.now();
      requestAnimationFrame(frame);
    }

    function takeOver() {
      auto = false;
    }

    addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      e.preventDefault();
      takeOver();
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? works.clientHeight : 1;
      target = clamp(target + e.deltaY * unit);

      if (reduceMotion.matches) {
        current = ours = works.scrollTop = target;
      } else {
        run();
      }
    }, { passive: false });

    // A finger dragged anywhere but on the column moves the column too
    let finger = null;

    addEventListener('touchstart', (e) => {
      takeOver();
      finger = works.contains(e.target) ? null : e.touches[0].clientY;
    }, { passive: true });

    addEventListener('touchmove', (e) => {
      if (finger === null) return;
      const y = e.touches[0].clientY;
      works.scrollTop = clamp(works.scrollTop + finger - y);
      current = target = ours = works.scrollTop;
      finger = y;
    }, { passive: true });

    addEventListener('keydown', (e) => {
      if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End', ' '].includes(e.key)) takeOver();
    });

    // Anything that moves the column but us (touch, keys, a drag) is the
    // visitor's: follow it
    works.addEventListener('scroll', () => {
      if (Math.abs(works.scrollTop - ours) > 1.5) {
        takeOver();
        current = target = ours = works.scrollTop;
      }
    }, { passive: true });

    document.fonts.ready.then(() => {
      if (!auto) return;
      setTimeout(() => {
        if (auto) {
          current = target = works.scrollTop;
          run();
        }
      }, START_AFTER);
    });
  </script>
